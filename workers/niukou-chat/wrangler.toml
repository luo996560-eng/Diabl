name = "diabl-niukou-chat"
main = "src/index.js"
compatibility_date = "2026-11-26"

# Configure these as Worker variables/secrets in the Cloudflare dashboard or CLI.
# AI_API_KEY must be a secret; never commit its value.
# AI_BASE_URL is the HTTPS OpenAI-compatible API root, e.g. https://api.example.com/v1
# AI_MODEL is the provider's model identifier.
# ALLOWED_ORIGIN must be the exact public game origin, e.g. https://luo996560-eng.github.io

# Optional Cloudflare Rate Limiting binding. If omitted, enforce rate limits at the gateway.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "REPLACE_WITH_NAMESPACE_ID"
# simple = { limit = 20, period = 60 }
