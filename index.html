<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>時空武林</title>
<meta name="theme-color" content="#f3ebe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時空武林">
<meta name="description" content="文字武俠養成遊戲，從 10 歲走到 100 歲。">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3ebe0;--paper:#faf6f0;--card:#fffdf9;--ink:#2c2416;--muted:#7a6a52;
  --gold:#b8860b;--gold-lt:#d4a84b;--crimson:#8b1e1e;--crimson-dk:#6b1515;
  --line:#e0d4c0;--line-dk:#c9b89a;--ok:#2d6a4f;--bad:#9b2226;--info:#1d4e89;
  --shadow:0 2px 12px rgba(60,40,20,.08);--radius:12px;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Serif TC","Songti TC",serif;font-size:14px;line-height:1.65;
  min-height:100vh}
body{padding:12px 12px 40px}
#game{max-width:1180px;margin:0 auto}

/* Top brand bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:6px;color:var(--crimson);font-weight:700}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:2px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.top-actions button,.wikiBtn{
  font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line-dk);
  border-radius:20px;padding:5px 12px;cursor:pointer;font-family:inherit;
  transition:background .15s,border-color .15s}
.top-actions button:hover,.wikiBtn:hover{background:#fff;border-color:var(--gold)}

/* Status strip */
#status{
  background:linear-gradient(180deg,#fffdf9,#f7f0e6);border:1px solid var(--line-dk);
  border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  box-shadow:var(--shadow);font-size:12.5px}
#status .stat{color:var(--muted)}#status .stat b{color:var(--ink);font-weight:600}
#status .stat-em b{color:var(--crimson)}
.hpbar{height:6px;background:#e8dfd0;border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-left:4px}
.hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#c45c4a,#e07a5f);border-radius:3px}
.progbar{height:8px;background:#e8dfd0;border-radius:4px;overflow:hidden;margin-top:4px}
.progbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--gold-lt));border-radius:4px;transition:width .3s}
.alignbar{height:6px;background:#e8dfd0;border-radius:3px;position:relative;overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-left:4px}
.alignbar>div{position:absolute;top:0;bottom:0}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;padding:4px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tab{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--muted);
  background:transparent;border:1px solid transparent;transition:all .15s;user-select:none}
.tab:hover{color:var(--ink);background:#f5efe6}
.tab.on{background:var(--crimson);color:#fff;border-color:var(--crimson-dk);font-weight:600}

/* Main 3-column layout */
.main-grid{display:grid;grid-template-columns:260px 1fr 280px;gap:14px;align-items:start}
@media(max-width:960px){.main-grid{grid-template-columns:1fr}.panel-side{order:2}#event-wrap{order:1}.panel-bag{order:3}}
.panel{
  background:var(--card);border:1px solid var(--line-dk);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.panel-hd{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;
  color:var(--crimson);background:linear-gradient(180deg,#fffdf9,#f8f1e6);letter-spacing:1px}
.panel-bd{padding:12px 14px;font-size:13px}
.panel-side .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.panel-side .row:last-child{border-bottom:none}
.panel-side .k{color:var(--muted)}.panel-side .v{color:var(--ink);font-weight:600}
.realm-box{background:#f5efe6;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.realm-box .rt{font-size:12px;color:var(--gold);font-weight:600}
.realm-box .rd{font-size:11px;color:var(--muted);margin-top:2px}

/* Event center */
#event-wrap{min-height:320px}
#event{background:var(--card);border:1px solid var(--line-dk);border-radius:var(--radius);
  padding:18px 20px;min-height:280px;box-shadow:var(--shadow)}
#event h2{color:var(--crimson);font-size:18px;margin:0 0 10px;letter-spacing:2px;
  border-bottom:1px solid var(--line);padding-bottom:8px;font-weight:700}
#event h2.subtle{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:1px;border:none;padding:0;margin-bottom:6px}
#event p{color:var(--ink);margin:8px 0;line-height:1.75}
#event input{width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line-dk);
  color:var(--ink);border-radius:8px;font-size:14px;margin:8px 0;font-family:inherit}
.ev-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.ev-banner{background:linear-gradient(90deg,#3d2a1a,#5a3d28);color:var(--gold);text-align:center;
  padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;letter-spacing:1px}

/* Options as cards */
.option,.opt-card{
  display:block;width:100%;text-align:left;background:#fff;color:var(--ink);
  border:1px solid var(--line-dk);border-radius:10px;padding:12px 14px;margin:8px 0;
  cursor:pointer;font-size:13.5px;font-family:inherit;line-height:1.5;
  transition:border-color .15s,box-shadow .15s,transform .1s}
.option:hover,.opt-card:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(184,134,11,.12);transform:translateY(-1px)}
.opt-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;
  margin-right:8px;vertical-align:middle;letter-spacing:.5px}
.tag-martial{background:#fde8e8;color:#9b2226}.tag-inner{background:#e8f0fe;color:#1d4e89}
.tag-wisdom{background:#f3e8fd;color:#6b21a8}.tag-fortune{background:#fef3c7;color:#92400e}
.tag-calm{background:#e8f5e9;color:#1b5e20}.tag-evil{background:#2d1a1a;color:#ef4444}
.tag-good{background:#e8f5e9;color:#166534}.tag-neutral{background:#f0ebe3;color:#5c4a32}
.tag-battle{background:#fee2e2;color:#b91c1c}.tag-special{background:#ede9fe;color:#5b21b6}
.opt-desc{display:inline;color:var(--ink)}

button.main{
  background:linear-gradient(180deg,var(--crimson),var(--crimson-dk));color:#fff;
  border:1px solid var(--crimson-dk);border-radius:10px;padding:11px 18px;font-size:14px;
  cursor:pointer;font-family:inherit;width:100%;margin-top:10px;font-weight:600;
  letter-spacing:1px;box-shadow:0 2px 6px rgba(139,30,30,.2)}
button.main:hover{filter:brightness(1.06)}
button.evo{background:linear-gradient(180deg,#a63d2a,#7a2e20);color:#ffe8d8;border:1px solid #c45c4a;
  border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-top:6px}
button.evo:disabled{background:#d4cbb8;color:#8a7a62;border-color:#c9b89a;cursor:not-allowed}
button.danger{background:#fff;color:var(--bad);border:1px solid #e8b4b4;border-radius:10px;
  padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;width:100%;margin-top:6px}
button.ghost{background:#fff;color:var(--muted);border:1px solid var(--line-dk);border-radius:10px;
  padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;width:100%;margin-top:6px}

/* Log */
#log{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;margin-top:12px;max-height:160px;overflow-y:auto;font-size:12px;
  color:var(--muted);box-shadow:var(--shadow)}
#log div{padding:2px 0;border-bottom:1px dashed var(--line)}
#log div:last-child{border:none}

/* Talent / master cards */
.talent-box{border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;border:2px solid var(--line-dk);
  background:#fff;transition:border-color .15s,box-shadow .15s}
.talent-box:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(184,134,11,.1)}
.talent-box .tn{font-size:16px;font-weight:700}.talent-box .td{font-size:13px;color:var(--muted);margin-top:4px}
.talent-box .tt{font-size:11px;float:right;font-weight:600}
.masterCard{border:2px solid var(--line-dk);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;background:#fff}
.masterCard .mn{font-size:16px;font-weight:700}.masterCard .ms{font-size:12px;color:var(--muted);margin:4px 0}
.masterCard .mdesc{font-size:13px;color:var(--ink);font-style:italic}

/* Step progress for create */
.steps{display:flex;gap:6px;justify-content:center;margin:12px 0 18px;flex-wrap:wrap}
.step{padding:6px 14px;border-radius:20px;font-size:12px;background:#f0ebe3;color:var(--muted);border:1px solid var(--line)}
.step.on{background:var(--crimson);color:#fff;border-color:var(--crimson-dk);font-weight:600}
.step.done{background:#e8f5e9;color:#166534;border-color:#a7d7b5}
.gender-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.gender-card{border:2px solid var(--line-dk);border-radius:14px;padding:24px 16px;text-align:center;
  cursor:pointer;background:#fff;transition:border-color .15s}
.gender-card:hover,.gender-card.sel{border-color:var(--crimson);background:#fdf6f6}
.gender-card .gicon{font-size:28px;margin-bottom:8px}.gender-card .gt{font-size:15px;font-weight:700}

/* Grid items equip/skill */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.item{background:#fff;border:1px solid var(--line-dk);border-radius:10px;padding:10px;font-size:12px}
.item .nm{font-weight:600;margin-bottom:2px}.item .at{color:var(--muted);font-size:11px}
.item .lb{font-size:10px;color:var(--gold);margin-bottom:2px}
.sellBtn{font-size:11px;padding:4px 8px;margin-top:4px;width:100%;cursor:pointer;border-radius:6px;
  border:1px solid var(--line-dk);background:#faf6f0;font-family:inherit}
.divine-weapon,.divine-skill{border-color:#d4a84b!important;box-shadow:0 0 0 1px rgba(212,168,75,.3)}
.master-weapon{border-color:#60a5fa!important}

/* Battle */
.battle-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.battle-wrap{grid-template-columns:1fr}}
.charBox{background:#faf6f0;border:1px solid var(--line-dk);border-radius:10px;padding:12px}
.charHpText{font-size:12px;color:var(--muted)}
#battleLog{max-height:200px;overflow-y:auto;font-size:12px;background:#f5efe6;border-radius:8px;padding:8px;margin:8px 0}

/* Toast / modal */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#f5efe6;
  padding:10px 20px;border-radius:24px;font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{margin:0 0 10px;color:var(--crimson)}

/* Changelog */
.changelogBox{max-width:560px;margin:40px auto;background:var(--card);border:1px solid var(--line-dk);
  border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.changelogBox .cl-ver{font-size:12px;color:var(--muted);margin-bottom:12px}
.changelogBox .cl-item{border-left:3px solid var(--gold);padding:10px 12px;margin:8px 0;background:#faf6f0;border-radius:0 8px 8px 0}
.changelogBox .cl-item.blue{border-left-color:#3b82f6}.changelogBox .cl-item.purple{border-left-color:#8b5cf6}
.changelogBox .cl-item.green{border-left-color:#22c55e}.changelogBox .cl-item.red{border-left-color:#ef4444}
.changelogBox .cl-item.pink{border-left-color:#ec4899}
.changelogBox .cl-t{font-weight:700;margin-bottom:4px}.changelogBox .cl-d{font-size:12.5px;color:var(--muted);line-height:1.7}

/* Misc legacy */
.statusBadge{display:inline-block;padding:2px 6px;margin:1px;border-radius:4px;font-size:10px;font-weight:bold}
.st-poison{background:#dcfce7;color:#166534}.st-weaken{background:#dbeafe;color:#1e40af}
.st-paralyze{background:#f3e8ff;color:#6b21a8}.st-confuse{background:#fae8ff;color:#86198f}
.st-armor{background:#ffedd5;color:#9a3412}.st-burn{background:#fee2e2;color:#991b1b}
.destinyCard{background:#fef9e7;border:1px solid #f0d48a;border-radius:8px;padding:8px;margin:6px 0}
.destinyCard .dt{color:var(--gold);font-weight:700;font-size:12px}.destinyCard .dd{font-size:12px;color:var(--muted)}
.coupleSkillCard{background:#fdf2f8;border:1px solid #f9a8d4;border-radius:8px;padding:8px;margin:6px 0}
.mtTaskBanner{background:linear-gradient(90deg,#3d2a1a,#5a3d28);color:var(--gold);padding:12px;border-radius:10px;text-align:center;margin-bottom:12px}
.mtTaskBanner .t1{font-size:16px;font-weight:700}.mtTaskBanner .t2{font-size:12px;opacity:.85}

/* Auto sell / use panel */
.auto-panel{background:linear-gradient(180deg,#fffdf9,#f7f0e6);border:1px solid var(--line-dk);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:12.5px}
.auto-title{font-weight:700;color:var(--crimson);font-size:13px;margin-bottom:4px;letter-spacing:1px}
.auto-desc{color:var(--muted);font-size:11.5px;line-height:1.55;margin-bottom:8px}
.auto-checks{display:flex;flex-wrap:wrap;gap:6px}
.auto-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--line-dk);background:#fff;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s}
.auto-chip input{accent-color:var(--chip,#b8860b);margin:0}
.auto-chip.on{border-color:var(--chip,#b8860b);color:var(--chip,#b8860b);background:#fff;box-shadow:0 0 0 1px var(--chip,#b8860b)}
.auto-chip span{font-weight:600}
.auto-switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px;border-radius:10px;border:1px solid var(--line-dk);background:#fff;margin-top:4px}
.auto-switch input{display:none}
.auto-switch .sw{width:40px;height:22px;border-radius:11px;background:#d4cbb8;position:relative;transition:background .2s;flex-shrink:0}
.auto-switch .sw::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.auto-switch.on .sw{background:var(--crimson)}
.auto-switch.on .sw::after{left:20px}
.auto-switch .sw-lab{font-size:12.5px;color:var(--ink);font-weight:600}
.auto-switch.on .sw-lab{color:var(--crimson)}


.info-card{background:linear-gradient(180deg,#fffdf9,#f5efe6);border:1px solid var(--line-dk);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:12.5px;color:var(--ink);line-height:1.7}
.stat-rows{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.stat-rows .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-rows .row:last-child{border-bottom:none}
.stat-rows .k{color:var(--muted)}.stat-rows .v{color:var(--ink);font-weight:600}
.unlock-list{max-height:120px;overflow:auto;font-size:12px;color:var(--muted);padding:4px 0 8px}
.unlock-item{padding:3px 0}
.lb-card{margin-top:14px;padding:14px;background:#fff;border:1px solid var(--line-dk);border-radius:12px;box-shadow:var(--shadow)}
.lb-title{color:var(--crimson);font-weight:700;margin-bottom:6px;font-size:14px}
.lb-desc{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.55}
.lb-row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}
.lb-row.me{background:#fef9e7;border-radius:6px;padding-left:8px;padding-right:8px}
.lb-row .v{color:var(--ink)}
.warn-card{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;margin:8px 0}
.ok-card{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin:8px 0}
.note-card{background:#f5efe6;border-left:3px solid var(--gold);padding:10px 12px;margin:8px 0;font-size:12.5px;color:var(--ink);border-radius:0 8px 8px 0}


.confirmBox{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.confirmBox .inner{background:var(--card);border:1px solid var(--line-dk);border-radius:14px;padding:20px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.confirmBox .inner h3{margin:0 0 8px;color:var(--crimson);font-size:16px}
.confirmBox .inner p{margin:0 0 14px;color:var(--ink);font-size:13.5px;line-height:1.6}


/* 小百科 */
.wiki-wrap{max-width:100%}
.wiki-intro{background:linear-gradient(180deg,#fffdf9,#f5efe6);border:1px solid var(--line-dk);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:13px;line-height:1.75;color:var(--ink)}
.wiki-intro b{color:var(--crimson)}
.wiki-cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.wikiCat{
  display:inline-block;padding:7px 14px;border-radius:20px;font-size:12.5px;
  background:#fff;border:1.5px solid var(--line-dk);color:var(--muted);
  cursor:pointer;font-weight:600;transition:all .15s;user-select:none
}
.wikiCat:hover{border-color:var(--gold);color:var(--ink)}
.wikiCat.on{background:var(--crimson);border-color:var(--crimson-dk);color:#fff}
.wiki-list{display:flex;flex-direction:column;gap:8px}
.wikiQ{
  background:#fff;border:1px solid var(--line-dk);border-radius:10px;
  padding:12px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);
  transition:border-color .15s,box-shadow .15s
}
.wikiQ:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(184,134,11,.1)}
.wikiQ.open{border-color:var(--crimson);border-bottom-left-radius:0;border-bottom-right-radius:0}
.wikiA{
  background:#faf6f0;border:1px solid var(--line-dk);border-top:none;
  border-radius:0 0 10px 10px;padding:12px 14px;font-size:13px;line-height:1.75;
  color:var(--ink);margin-top:-8px
}
.wikiA ul{margin:6px 0;padding-left:1.2em}
.wikiA li{margin:3px 0}
.wikiA .tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-right:4px}


.auto-sec{background:#faf6f0;border:1px solid var(--line-dk);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.auto-sec-t{font-size:13px;font-weight:700;color:var(--crimson);margin-bottom:8px}
.auto-chk{display:block;font-size:13px;margin:6px 0;color:var(--ink);cursor:pointer}
.auto-chk input{margin-right:6px;vertical-align:middle}

/* 戰鬥介面優化 */
.battleScreen{background:linear-gradient(180deg,#faf6f0,#f0e8dc);border:1px solid var(--line-dk);border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(40,30,20,.08)}
.battleHeader{text-align:center;font-weight:700;font-size:15px;color:var(--crimson);margin-bottom:12px;letter-spacing:1px}
.battleChar{background:#fff;border:1px solid var(--line-dk);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.battleChar .charName{font-weight:700;font-size:14px;margin-bottom:6px;color:var(--ink)}
.battleChar.enemy .charName{color:#9b2226}
.battleChar.player .charName{color:#1d4e89}
.charHpBar{height:10px;background:#e8e0d4;border-radius:6px;overflow:hidden;margin:4px 0}
.charHpBar>div{height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:6px;transition:width .25s}
.battleChar.enemy .charHpBar>div{background:linear-gradient(90deg,#b91c1c,#ef4444)}

/* ========== 共用模板 ========== */
var SLOT_KEYS=['頭部','身體','腰帶','主手','副手','項鍊','鞋子','戒指1','戒指2'];

/* ========== 存檔設定 ========== */
var SAVE_KEY='wuxiaSave';
var SAVE_VERSION=22;
var SAVE_BAK_PREFIX='wuxiaSave_bak_';
var AUCTION_TICKET_FRAGMENTS_NEEDED=100;
var TOTAL_SCORE=0;
try{var _ls=localStorage.getItem('wuxiaScore');if(_ls)TOTAL_SCORE=parseInt(_ls)||0;}catch(e){}
function saveScore(){try{localStorage.setItem('wuxiaScore',TOTAL_SCORE);}catch(e){}}

function markPlayed(){try{localStorage.setItem('wuxiaPlayed','1');}catch(e){}}
var _saveTimer=null;
function scheduleSave(){if(_saveTimer)return;if(!S||S.gameOver)return;_saveTimer=setTimeout(function(){_saveTimer=null;if(S&&!S.gameOver)saveGame();},600);}

/* ========== 江湖謠言（更新公告） ========== */
var CHANGELOG_VERSION='v25.1';
var CHANGELOG_PAGE=0;
var CHANGELOG_PER_PAGE=3;
var CHANGELOG_ITEMS=[
  {cls:'gold',t:'✨ v25.1 重置／繼承／塔天賦',d:'・徹底重置含塔天賦與塔進度。<br>・塔天賦改獨立頁選擇，不再混入開局列表。<br>・結算：半積分繼承本世 50% 屬性（可累加）。<br>・神品子女永不死亡；升級經驗再提升。'},
  {cls:'purple',t:'✨ v25.0 自動與養成大改',d:'・自動設定整合背包清理、功法／裝備賣出、自動使用丹藥、評分換裝。<br>・寵物／伴侶依「資質」篩選；紅顏滿員淘汰最低資質。<br>・自動進化、求婚、扶正、拍賣（僅套裝）、懸賞依正邪接取。<br>・戰鬥結束後自動返回主線事件。'},
  {cls:'green',t:'⚔ 成長加速',d:'・所有神品功法／武器／裝備皆可升級。<br>・戰鬥經驗大幅提升，更快滿級突破。<br>・拍賣行只出產套裝神品。'},
  {cls:'blue',t:'💞 伴侶與子女',d:'・伴侶、子女不再因年齡自然死亡（僅戰鬥相關）。<br>・寵物神品資質機率提高並保底。'},

];
function showChangelog(){
  CHANGELOG_PAGE=0;
  renderChangelogPage();
}
function renderChangelogPage(){
  var el=document.getElementById('event');
  document.getElementById('status').innerHTML='';
  document.getElementById('log').innerHTML='';
  document.getElementById('tabsBar').style.display='none';
  var total=CHANGELOG_ITEMS.length;
  var start=CHANGELOG_PAGE*CHANGELOG_PER_PAGE;
  var end=Math.min(start+CHANGELOG_PER_PAGE,total);
  var pageItems=CHANGELOG_ITEMS.slice(start,end);
  var hasMore=end<total;
  var pageNum=CHANGELOG_PAGE+1;
  var totalPages=Math.ceil(total/CHANGELOG_PER_PAGE);
  var h='<div class="changelogBox"><div class="cl-title">✦ 江湖謠言 ✦</div>';
  h+='<div class="cl-ver">版本 '+CHANGELOG_VERSION+' · '+new Date().toLocaleDateString()+' · 第 '+pageNum+'/'+totalPages+' 頁</div>';
  pageItems.forEach(function(it){
    h+='<div class="cl-item '+(it.cls||'')+'"><div class="cl-t">'+it.t+'</div><div class="cl-d">'+it.d+'</div></div>';
  });
  if(hasMore){
    h+='<button class="main" onclick="nextChangelogPage()" style="margin-top:12px;background:linear-gradient(180deg,var(--crimson),var(--crimson-dk));border-color:var(--crimson-dk);font-size:15px;padding:12px">▶ 下一頁謠言（'+pageNum+'/'+totalPages+'）</button>';
  }else{
    h+='<button class="main" onclick="closeChangelog()" style="margin-top:12px;background:linear-gradient(180deg,var(--crimson),var(--crimson-dk));border-color:var(--crimson-dk);font-size:15px;padding:12px">✓ 關閉公告，進入遊戲</button>';
  }
  h+='</div>';
  el.innerHTML=h;
}
function nextChangelogPage(){
  CHANGELOG_PAGE++;
  renderChangelogPage();
}
function closeChangelog(){
  var hasSave=false;try{hasSave=!!localStorage.getItem(SAVE_KEY);}catch(e){}
  if(hasSave){showStartMenu();}else{newGame();}
}

/* ========== PWA ========== */
function setupPWA(){
  try{
    function genIcon(size){var c=document.createElement('canvas');c.width=c.height=size;var ctx=c.getContext('2d');var g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#8b1e1e');g.addColorStop(1,'#3d1515');ctx.fillStyle=g;ctx.fillRect(0,0,size,size);ctx.strokeStyle='#e6b85c';ctx.lineWidth=Math.max(2,size*0.035);ctx.strokeRect(size*0.07,size*0.07,size*0.86,size*0.86);ctx.fillStyle='#e6b85c';ctx.font='bold '+(size*0.5)+'px "PingFang TC",serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('武',size/2,size*0.53);return c.toDataURL('image/png');}
    var i192=genIcon(192),i512=genIcon(512);
    var ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=i192;document.head.appendChild(ap);
    var fv=document.createElement('link');fv.rel='icon';fv.type='image/png';fv.href=i192;document.head.appendChild(fv);
    var mf={name:'時空武林',short_name:'時空武林',start_url:'./',display:'standalone',orientation:'portrait',background_color:'#f3ebe0',theme_color:'#f3ebe0',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    var url=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));
    var lk=document.createElement('link');lk.rel='manifest';lk.href=url;document.head.appendChild(lk);
  }catch(e){}
}

/* ========== 工具函式 ========== */
function toast(msg,dur){dur=dur||2200;var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(function(){t.style.opacity='0';},dur);}
var _confirmOpen=false;
function confirmBox(title,msg,onYes,onNo){
  if(_confirmOpen)return; // 同一時間只允許一個確認框
  _confirmOpen=true;
  var box=document.createElement('div');box.className='confirmBox';
  box.innerHTML='<div class="inner"><h3>'+title+'</h3><p>'+msg+'</p><button type="button" class="main" id="cfmYes">確定</button><button type="button" class="ghost" id="cfmNo">取消</button></div>';
  document.body.appendChild(box);
  var _locked=false;
  function _done(fn){
    if(_locked)return;_locked=true;_confirmOpen=false;
    if(box.parentNode)document.body.removeChild(box);
    if(fn)try{fn();}catch(e){console.error(e);}
  }
  box.querySelector('#cfmYes').onclick=function(){_done(onYes);};
  box.querySelector('#cfmNo').onclick=function(){_done(onNo);};
  // 點遮罩取消
  box.addEventListener('click',function(e){if(e.target===box)_done(onNo);});
}
function resetAll(){
  if(_confirmOpen)return;
  confirmBox('🗑️ 重置存檔','將清除所有進度與積分，確定嗎？',function(){
    try{
      localStorage.removeItem('wuxiaScore');
      localStorage.removeItem('wuxiaPlayed');
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem('wuxiaInheritanceBonus');
    }catch(e){}
    TOTAL_SCORE=0;IS_FIRST_LIFE=true;
    try{newGame();}catch(e){location.reload();}
  });
}
function rnd(a){return Math.floor(Math.random()*a)}
function pick(a){return a[rnd(a.length)]}
function chance(p){return Math.random()<p}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=rnd(i+1);var t=b[i];b[i]=b[j];b[j]=t}return b}

function generateName(gender){
  var g=(gender==='女'||gender==='female')?'女':'男';
  var existing=typeof getAllExistingNames==='function'?getAllExistingNames():[];
  var pool=g==='男'?NAME_MALE:NAME_FEMALE;
  var seen={};
  for(var a=0;a<200;a++){
    var sn=NAME_SURNAMES[rnd(NAME_SURNAMES.length)];
    var gv=pool[rnd(pool.length)];
    if(chance(0.35)){
      var g2=pool[rnd(pool.length)];
      if(g2!==gv)gv=gv+g2;
    }
    var full=sn+gv;
    if(existing.indexOf(full)>=0)continue;
    if(seen[full])continue;
    seen[full]=1;
    // 性別隔離：不再混用另一性別字庫
    return full;
  }
  return NAME_SURNAMES[rnd(NAME_SURNAMES.length)]+pool[rnd(pool.length)]+pool[rnd(pool.length)];
}

function initAchievements(){
  if(!S.achievements)S.achievements={};
  if(!S.achieveStats)S.achieveStats={wushenTriggerInBattle:0,dodgeInBattle:0,riddleStreak:0,maxRiddleStreak:0,battleUsesUndying:0,triggeredUndying:false};
}
function hasAchievement(id){return !!(S&&S.achievements&&S.achievements[id]);}
function unlockAchievement(id){
  if(!S||hasAchievement(id))return;
  if(!S.achievements)S.achievements={};
  S.achievements[id]=true;
  var ach=null;
  for(var i=0;i<ACHIEVEMENTS.length;i++){if(ACHIEVEMENTS[i].id===id){ach=ACHIEVEMENTS[i];break;}}
  if(!ach)return;
  S.log.push('【成就】'+ach.icon+' '+ach.name);
  showAchievePop(ach);saveGame();
}
function showAchievePop(ach){
  var box=document.createElement('div');box.className='achievePop';
  box.innerHTML='<div class="atitle">🏆 成就解鎖 🏆</div><div class="aname">'+ach.icon+' '+ach.name+'</div><div class="adesc">'+ach.desc+'</div>';
  document.body.appendChild(box);
  setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box);},2800);
}
function checkAchievements(){
  if(!S)return;initAchievements();
  try{
    if(S.money>(S.maxMoneyEver||0))S.maxMoneyEver=S.money;
    if((S.maxMoneyEver||0)>=10000)unlockAchievement('rich_10000');
    if((S.maxMoneyEver||0)>=100000)unlockAchievement('rich_100000');
    if(S.confidantes&&S.confidantes.length>=3)unlockAchievement('confidante_3');
    if(S.confidantes&&S.confidantes.length>=10)unlockAchievement('confidante_10');
    if(S.hasAuctionTicket)unlockAchievement('auction_enter');
    var counts=typeof getEquippedSetCounts==='function'?getEquippedSetCounts():{};
    for(var sid in counts){if(counts[sid]>=5){unlockAchievement('set_full');break;}}
    for(var slot in (S.equip||{})){
      var eq=S.equip[slot];
      if(eq&&eq.setBreakthrough){unlockAchievement('set_break');break;}
    }
    if(S.pets&&S.pets.length>=5)unlockAchievement('pet_5');
    if(S.pets&&S.pets.some(function(p){return p.aptitude==='神品';}))unlockAchievement('pet_god');
    if(S.partner&&!S.partnerDead){
      unlockAchievement('partner_meet');
      if(S.partner.stage==='夫妻')unlockAchievement('partner_marry');
      if(S.partner.aptitude==='神品'&&S.partner.destinyTalent)unlockAchievement('partner_destiny');
    }
    if(S.master){
      unlockAchievement('master_join');
      if(S.master.rank>=2)unlockAchievement('master_guan');
    }
    if(S.exiledFrom)unlockAchievement('master_exile');
    if(S.destinyMasters&&S.destinyMasters.length>=1)unlockAchievement('destiny_bond');
    if(S.destinyMasters&&S.destinyMasters.length>=5)unlockAchievement('destiny_5');
    if(S.tower&&(S.tower.bestFloor||0)>=10)unlockAchievement('tower_10');
    if(S.tower&&(S.tower.bestFloor||0)>=50)unlockAchievement('tower_50');
    if(S.tower&&(S.tower.bestFloor||0)>=100)unlockAchievement('tower_100');
    var kids=(S.childrenList&&S.childrenList.length)||S.children||0;
    if(kids>=1)unlockAchievement('child_1');
    if(kids>=6)unlockAchievement('child_6');
    if((S.fame||0)>=100)unlockAchievement('fame_100');
    if((S.fame||0)>=500)unlockAchievement('fame_500');
    if((S.age||0)>=50)unlockAchievement('age_50');
    if((S.age||0)>=80)unlockAchievement('age_80');
    if((S.age||0)>=100)unlockAchievement('age_100');
    if((S.martial||0)>=100)unlockAchievement('martial_100');
    if((S.martial||0)>=300)unlockAchievement('martial_300');
    if((S.inner||0)>=100)unlockAchievement('inner_100');
    if((S.inner||0)>=300)unlockAchievement('inner_300');
    if((S.battleWins||0)>=10)unlockAchievement('win_10');
    if((S.battleWins||0)>=100)unlockAchievement('win_100');
    if((S.righteous||0)-(S.demonic||0)>=50)unlockAchievement('align_good');
    if((S.demonic||0)-(S.righteous||0)>=50)unlockAchievement('align_evil');
    if(S.autoPlay)unlockAchievement('auto_user');
    if((S.riddleCorrect||0)>=30)unlockAchievement('riddle_streak_30');
  }catch(e){console.error('checkAchievements',e);}
}

/* ========== 天賦判定 / 資質 ========== */
function hasTalent(name){return !!(S&&S.talent&&S.talent.talent&&S.talent.talent.name===name);}
function moneyGain(a){return hasTalent('財神眷顧')?Math.floor(a*1.5):a;}
function clampMoney(){if(S&&typeof S.money==='number'){S.money=Math.max(0,Math.floor(S.money));}if(S&&typeof S.hp==='number'){S.hp=Math.max(0,S.hp);}if(S&&typeof S.stress==='number'){S.stress=Math.max(0,S.stress);}}
function canAfford(cost){return S&&S.money>=cost;}
function spendMoney(cost){if(!canAfford(cost))return false;S.money-=cost;clampMoney();return true;}
var APT_BATTLE_MULT={'凡品':1.0,'良品':1.3,'上品':1.7,'絕品':2.2,'神品':3.0};
function getAptMult(apt){return APT_BATTLE_MULT[apt]||1.0;}

  armor_break:{name:'破甲',badge:'st-armor',icon:'✖',desc:'防禦力 -50%',maxTurns:3,defMult:0.5},

};
function addStatus(target,type,turns){
  if(!target.statuses)target.statuses={};
  var def=STATUS_DEFS[type];if(!def)return;
  var t=turns||def.maxTurns;
  if(target.statuses[type])target.statuses[type]=Math.max(target.statuses[type],t);
  else target.statuses[type]=t;
}
function hasStatus(target,type){return target.statuses&&target.statuses[type]>0;}
function clearOneBadStatus(target){
  if(!target.statuses)return false;
  for(var k in target.statuses){
    if(target.statuses[k]>0){target.statuses[k]=0;return k;}
  }
  return false;
}
function tickStatuses(target,logArr){
  if(!target.statuses)return;
  var toRemove=[];
  for(var type in target.statuses){
    var turns=target.statuses[type];
    if(turns<=0){toRemove.push(type);continue;}
    var def=STATUS_DEFS[type];
    if(!def){toRemove.push(type);continue;}
    if(def.dotRate&&target.maxHp>0){
      var dmg=Math.floor(target.maxHp*def.dotRate);
      target.hp=Math.max(0,target.hp-dmg);
      if(logArr)logArr.push({who:'system',skill:'☠ '+target.name+' 受到 '+def.name+' 效果：'+dmg+' 點傷害'});
    }
    target.statuses[type]--;
    if(target.statuses[type]<=0)toRemove.push(type);
  }
  toRemove.forEach(function(t){delete target.statuses[t];});
}
function statusAtkMult(target){return hasStatus(target,'weaken')?STATUS_DEFS.weaken.atkMult:1;}
function statusDefMult(target){return hasStatus(target,'armor_break')?STATUS_DEFS.armor_break.defMult:1;}
function statusBadgesHTML(target){
  if(!target.statuses)return '';
  var html='';
  for(var t in target.statuses){
    if(target.statuses[t]>0){
      var def=STATUS_DEFS[t];
      html+='<span class="statusBadge '+def.badge+'">'+def.icon+def.name+'('+target.statuses[t]+')</span>';
    }
  }
  return html;
}

var TIER_ORDER=['凡品','良品','上品','絕品','神品'];

function rollTier(){var total=0,list=[];for(var t in TIERS){total+=TIERS[t].w;list.push(t);}var r=Math.random()*total;for(var i=0;i<list.length;i++){r-=TIERS[list[i]].w;if(r<=0)return list[i];}return '凡品';}
function rollTierForCompanion(){
  // 寵物／伴侶：神品約 15% + 12 次保底
  if(!S._companionPity)S._companionPity=0;
  S._companionPity++;
  if(S._companionPity>=12){S._companionPity=0;return '神品';}
  if(chance(0.15)){S._companionPity=0;return '神品';}
  if(chance(0.20))return '絕品';
  if(chance(0.30))return '上品';
  if(chance(0.40))return '良品';
  return '凡品';
}

function getEquippedSetCounts(){var c={};if(!S||!S.equip)return c;for(var s in S.equip){var e=S.equip[s];if(e&&e.setId)c[e.setId]=(c[e.setId]||0)+1;}return c;}
function getSetBonus(){
  var counts=getEquippedSetCounts(),bonus={martial:0,inner:0,wisdom:0,fortune:0,maxHp:0,calm:0,specials:[]};
  // 統計該套已突破件數 → 套裝效果倍率
  var btCount={};
  for(var slot in S.equip){
    var e=S.equip[slot];
    if(e&&e.isSetPiece&&e.setId&&e.setBreakthrough)btCount[e.setId]=(btCount[e.setId]||0)+1;
  }
  function addAttr(b,mul){if(!b)return;mul=mul||1;for(var k in b){if(bonus[k]!==undefined)bonus[k]+=Math.floor(b[k]*mul);}}
  for(var sid in counts){
    var n=counts[sid],set=EQUIPMENT_SETS[sid];if(!set)continue;
    var mul=1;
    // 突破件越多倍率越高：2件突破≈1.3、3≈1.5、5全破=2.0
    var bt=btCount[sid]||0;
    if(bt>=5)mul=2;else if(bt>=3)mul=1.5;else if(bt>=2)mul=1.3;else if(bt>=1)mul=1.15;
    if(n>=2)addAttr(set.bonus2,mul);if(n>=3)addAttr(set.bonus3,mul);
    if(n>=5){
      addAttr(set.bonus5,mul);
      if(set.special5){
        var sp=Object.assign({},set.special5);
        if(sp.value!==undefined)sp.value=+(sp.value*mul).toFixed(3);
        bonus.specials.push({setId:sid,set:set,special:sp,mul:mul});
      }
    }
  }
  return bonus;
}
function getSetSpecialValue(type){var b=getSetBonus(),v=0;b.specials.forEach(function(sp){if(sp.special.type===type)v+=sp.special.value;});return v;}
function applySetToEquip(eq){
  // 僅最高階（神品）可成套裝；部位不限，凡能裝備者皆可
  if(!eq||eq.tier!=='神品')return eq;
  if(!chance(0.8))return eq;
  var sid=pick(Object.keys(EQUIPMENT_SETS)),set=EQUIPMENT_SETS[sid];
  eq.setId=sid;eq.setName=set.name;eq.isSetPiece=true;
  eq.baseName=eq.baseName||eq.name;
  eq.name='【'+set.name+'】'+eq.name;
  eq.canLevel=true;eq.level=eq.level||1;eq.exp=eq.exp||0;eq.expNext=eq.expNext||90;
  eq.setBreakthrough=!!eq.setBreakthrough;
  return eq;
}
function formatBonus(b){
  if(!b)return '無';
  var parts=[];
  for(var k in b){if(k==='special'||ATTR_NAMES[k]===undefined)continue;parts.push(ATTR_NAMES[k]+'+'+b[k]);}
  return parts.join('　');
}
function genEquip(slot,forceTier){
  if(!slot)slot=pick(Object.keys(SLOT_DEF));
  var tier=forceTier||rollTier();
  var def=SLOT_DEF[slot]||SLOT_DEF['主手'];
  var name=pick(EQ_PREFIX)+pick(def.names);
  var mult=TIERS[tier].mult,main=pick(MAIN_ATTRS);
  var mainVal=Math.max(1,Math.floor((3+rnd(5))*mult));
  var subCount=rnd(2)+1,subs=[];
  for(var i=0;i<subCount;i++){
    var a=pick(MAIN_ATTRS);if(a.key===main.key)continue;
    subs.push({name:a.name,key:a.key,val:Math.max(1,Math.floor((1+rnd(3))*mult))});

function genSkill(forceTier){
  var tier=forceTier||rollTier();
  var type=pick(Object.keys(SKILL_TYPES));
  var name=pick(SKILL_PREFIX)+pick(SKILL_TYPES[type]);
  var mult=TIERS[tier].mult,main=pick(MAIN_ATTRS);
  var mainVal=Math.max(1,Math.floor((5+rnd(8))*mult));
  var subCount=rnd(2),subs=[];
  for(var i=0;i<subCount;i++){
    var a=pick(MAIN_ATTRS);if(a.key===main.key)continue;
    subs.push({name:a.name,key:a.key,val:Math.max(1,Math.floor((2+rnd(4))*mult))});
  }
  var sk={id:'sk'+Date.now()+rnd(99999),type:'skill',stype:type,tier:tier,name:name,main:{name:main.name,key:main.key,val:mainVal},subs:subs,baseName:name};
  if(tierRank(tier)>=tierRank('上品')){
    sk.level=1;sk.exp=0;sk.expNext=(tier==='神品'?100:(tier==='絕品'?120:150));
    sk.canLevel=true;sk.isDivine=false;sk.isMasterSkill=false;
  }
  return sk;
}
function genItem(forceTier){
  var tier=forceTier||rollTier();
  var mult=TIERS[tier].mult;

  if(roll<0.28){var evo=pick(EVO_ITEMS);return {id:'it'+Date.now()+rnd(99999),type:'item',tier:tier,name:evo,main:{name:'進化道具',key:'evo',val:1},evoName:evo,subs:[]};}
  else if(roll<0.55){var hn=pick(['金創藥','回春丹','療傷丹','活血散','續命丹']);return {id:'it'+Date.now()+rnd(99999),type:'item',tier:tier,name:hn,main:{name:'當前血量',key:'hp',val:Math.floor((20+rnd(30))*mult)},subs:[]};}
  else{var nm=pick(ITEM_NAMES),m=pick(MAIN_ATTRS);return {id:'it'+Date.now()+rnd(99999),type:'item',tier:tier,name:nm,main:{name:m.name,key:m.key,val:Math.max(1,Math.floor((2+rnd(4))*mult))},subs:[]};}
}

function rewardTier(scale){
  var r=Math.random();
  if(scale===0){if(r<0.7)return '凡品';if(r<0.95)return '良品';return '上品';}
  if(scale===1){if(r<0.4)return '良品';if(r<0.8)return '上品';if(r<0.97)return '絕品';return '神品';}
  if(r<0.3)return '上品';if(r<0.75)return '絕品';return '神品';
}
function shouldAutoSellEquip(eq){
  ensureAutoSettings();
  return !!(eq&&!eq.fromMaster&&!eq.isMasterWeapon&&S.autoSellTiers&&S.autoSellTiers[eq.tier]);
}
function addToBagEquip(eq){
  if(!eq)return {sold:false,msg:''};
  if(shouldAutoSellEquip(eq)){
    var p=moneyGain(TIERS[eq.tier]?TIERS[eq.tier].val:10);
    S.money+=p;
    return {sold:true,price:p,msg:'獲得裝備「'+eq.name+'」→ 自動賣出 <b>'+p+'</b> 兩'};
  }
  if(S.bagEquip.length>=20){
    var fb=TIERS[eq.tier]?TIERS[eq.tier].val:10;
    S.money+=fb;
    return {sold:true,price:fb,msg:'獲得裝備「'+eq.name+'」（背包已滿，折算 '+fb+' 兩）'};
  }
  S.bagEquip.push(eq);
  return {sold:false,msg:'獲得裝備「<b style="color:'+(TIERS[eq.tier]?TIERS[eq.tier].c:'#c9b58a')+'">'+eq.name+'</b>」（'+eq.tier+'・'+eq.main.name+'+'+eq.main.val+'）'};
}
function processAutoSellBag(){
  ensureAutoSettings();
  if(!S.bagEquip||!S.bagEquip.length)return 0;
  var sold=0,gain=0,keep=[];
  S.bagEquip.forEach(function(eq){
    if(shouldAutoSellEquip(eq)){
      var p=moneyGain(TIERS[eq.tier]?TIERS[eq.tier].val:10);
      S.money+=p;gain+=p;sold++;
    }else keep.push(eq);
  });
  S.bagEquip=keep;
  if(sold>0){toast('自動賣出 '+sold+' 件裝備，獲 '+gain+' 兩',2500);S.log.push('【自動賣出】'+sold+' 件裝備 → '+gain+' 兩');}
  return sold;
}
function grantEquip(scale,slot){
  var tier=rewardTier(scale);slot=slot||pick(Object.keys(SLOT_DEF));
  var eq=genEquip(slot,tier);if(tier==='神品')eq=applySetToEquip(eq);
  var r=addToBagEquip(eq);
  return r.msg;
}
function grantSkill(scale){
  var tier=rewardTier(scale),sk=genSkill(tier);
  if(S.skills.length>=30){var fb=TIERS[tier].val*2;S.money+=fb;return '習得功法「'+sk.name+'」（功法已滿，折算 '+fb+' 兩）';}
  S.skills.push(sk);
  return '習得功法「<b style="color:'+TIERS[tier].c+'">'+sk.name+'</b>」（'+sk.tier+'・'+sk.main.name+'+'+sk.main.val+'）';
}
function tryAutoUseItem(it){
  ensureAutoSettings();
  if(!S.autoUseItem||!it||!it.main)return null;
  var k=it.main.key,v=it.main.val||0;
  if(k==='evo'||k==='mat')return null; // 進化／材料不自動用
  if(k==='hp'){
    var b=S.hp;S.hp=Math.min(getTotalMaxHp(),S.hp+v);
    return '獲得並使用「'+it.name+'」，恢復 '+(S.hp-b)+' 血';
  }
  if(k==='maxHp'){
    S.maxHp=(S.maxHp||0)+v;S.hp=(S.hp||0)+v;
    return '獲得並使用「'+it.name+'」，血量上限 +'+v;
  }
  if(k==='money'){
    S.money=(S.money||0)+v;
    return '獲得並使用「'+it.name+'」，銀兩 +'+v;
  }
  // 屬性類：武力／內力／悟性／福緣／靜 等
  if(k&&(S[k]!==undefined||['martial','inner','wisdom','fortune','calm','fame','regen'].indexOf(k)>=0)){
    S[k]=(S[k]||0)+v;
    return '獲得並使用「'+it.name+'」，'+(getAttrName(k)||k)+' +'+v;
  }
  return null;
}
function addToBagItem(it){
  if(!it)return '（無道具）';
  var used=tryAutoUseItem(it);
  if(used){return used;}
  if(S.bagItem.length>=30){
    var fb=(TIERS[it.tier]&&TIERS[it.tier].val)||10;
    S.money+=fb;
    return '獲得道具「'+it.name+'」（背包已滿，折算 '+fb+' 兩）';
  }
  S.bagItem.push(it);
  var tc=(TIERS[it.tier]&&TIERS[it.tier].c)||'#7a6a52';
  return '獲得道具「<b style="color:'+tc+'">'+it.name+'</b>」（'+it.tier+'）';
}
function processAutoUseBag(){
  ensureAutoSettings();
  if(!S.autoUseItem||!S.bagItem||!S.bagItem.length)return 0;
  var keep=[],used=0,msgs=[];
  S.bagItem.forEach(function(it){
    var msg=tryAutoUseItem(it);
    if(msg){used++;msgs.push(msg);}
    else keep.push(it);
  });
  S.bagItem=keep;
  if(used>0){
    toast('自動使用 '+used+' 件道具',2500);
    S.log.push('【自動使用】'+used+' 件道具');
  }
  return used;
}
function grantItem(scale){
  var tier=rewardTier(scale),it=genItem(tier);
  return addToBagItem(it);
}
function grantMoney(scale){
  var base=scale===0?10+Math.random()*35:scale===1?50+Math.random()*120:150+Math.random()*300;
  var amt=moneyGain(Math.floor(base));S.money+=amt;
  return '獲得 <b style="color:#fbbf24">'+amt+'</b> 兩';
}
function grantAttr(count,scale){
  var attrs=['martial','inner','wisdom','fortune','calm'];
  var picked=shuffle(attrs).slice(0,count||1);
  var maxV=scale===0?3:scale===1?5:8;var parts=[];
  picked.forEach(function(k){var v=1+rnd(maxV);S[k]=(S[k]||0)+v;parts.push(getAttrName(k)+' +'+v);});
  return parts.join('　');
}
function grantHp(scale){
  var base=scale===0?15:scale===1?35:60;var amt=base+rnd(base);
  var b=S.hp;S.hp=Math.min(getTotalMaxHp(),S.hp+amt);
  return '恢復 '+(S.hp-b)+' 點氣血';
}
function grantStress(scale){
  var base=scale===0?8:scale===1?15:25;var amt=base+rnd(base);
  var b=S.stress;S.stress=Math.max(0,S.stress-amt);
  return '壓力 -'+(b-S.stress);
}
function grantFame(scale){var base=scale===0?1:scale===1?3:6;var amt=base+rnd(base);S.fame+=amt;return '名聲 +'+amt;}
function grantRighteous(scale){var base=scale===0?1:scale===1?2:4;var amt=base+rnd(base);S.righteous+=amt;return '俠氣 +'+amt;}
function grantEvil(scale){var base=scale===0?1:scale===1?2:4;var amt=base+rnd(base);S.demonic+=amt;return '魔性 +'+amt;}
function grantEvoItem(){
  var item=pick(EVO_ITEMS);
  if(S.pets.length>0){var p=pick(S.pets);p.evoItems[item]=(p.evoItems[item]||0)+1;return '寵物 '+p.n+' 獲得進化道具「'+item+'」';}
  if(S.bagItem.length<30){S.bagItem.push({id:'it'+Date.now()+rnd(9999),type:'item',tier:'上品',name:item,main:{name:'進化道具',key:'evo',val:1},evoName:item,subs:[]});return '獲得進化道具「'+item+'」';}
  return '獲得進化道具「'+item+'」（但背包已滿）';
}

/* ========== 事件選擇邏輯 ========== */
function pickScene(){
  var age=S.age;
  var pool={market:age<15?15:25,wild:20,inn:age<12?10:20,sect:age<14?5:15,jianghu:age<16?5:20,fate:5};
  var total=0;for(var k in pool)total+=pool[k];
  var r=Math.random()*total;
  for(var k in pool){r-=pool[k];if(r<=0)return k;}
  return 'jianghu';
}
function rollRarity(){
  var total=0;for(var k in RARITY_WEIGHT)total+=RARITY_WEIGHT[k];
  var r=Math.random()*total;
  for(var k in RARITY_WEIGHT){r-=RARITY_WEIGHT[k];if(r<=0)return k;}
  return 'daily';
}
function convertEvent(ev){
  if(!ev)return genEvent();
  var srcOpts=ev.o||ev.opts||[];
  var opts=srcOpts.map(function(pair){
    if(Array.isArray(pair))return {t:pair[0],f:pair[1]};
    return {t:pair.t||pair.text,f:pair.f};
  });
  return {id:ev.id,once:ev.once||false,w:ev.w||1,text:ev.t||ev.text,opts:opts,_rarity:ev.r||'daily',_cond:ev.cond};
}
function prepareSpecialEvent(ev){
  if(!ev||ev.id!=='pa')return ev;
  var speciesList=['狗','貓','鷹','蛇','狼','蟲','鼠','蟻','猴','龜','鹿','狐'];
  var cache={};
  speciesList.forEach(function(sp){cache[sp]={name:pick(PET_NAMES[sp]),tier:rollTierForCompanion()};});
  var cloned={};
  for(var k in ev)cloned[k]=ev[k];
  var srcOpts=ev.opts||ev.o||[];
  cloned.opts=srcOpts.map(function(o){
    var otext=Array.isArray(o)?o[0]:(o.t||o.text);
    var ofunc=Array.isArray(o)?o[1]:o.f;
    var sp=PET_SPECIES_MAP[otext];
    if(!sp)return {t:otext,f:ofunc};
    var data=cache[sp];
    return {t:otext,text:otext+'（'+data.name+'・資質：'+data.tier+'）',f:(function(species,d){return function(s){
      var result=createPet(s,species,d.tier,d.name);
      if(!result)return '寵物欄位已滿。';
      return '你收養了「'+d.name+'」（'+d.tier+'），牠成為你的寵物。';
    };})(sp,data)};
  });
  return cloned;
}
function _pickEventInner(){
  if(S.next){
    var nextId=S.next;S.next=null;
    var chained=(SCENE_EVENTS['special']||[]).filter(function(e){return e.id===nextId;})[0];
    if(!chained){
      for(var sk in SCENE_EVENTS){
        var found=SCENE_EVENTS[sk].filter(function(e){return e.id===nextId;})[0];
        if(found){chained=found;break;}
      }
    }
    if(chained)return convertEvent(chained);
  }
  if(S.inheritedDeeds&&S.inheritedDeeds.length){
    var inhEv=generateInheritedEvents();
    if(inhEv.length&&chance(0.4))return pick(inhEv);
  }
  var rarity=rollRarity();
  var scene;
  if(rarity==='destiny'){scene='fate';}
  else{scene=pickScene();}
  var sceneList=SCENE_EVENTS[scene]||[];
  var pool=sceneList.filter(function(e){
    if(e.once&&hasSeen(e.id))return false;
    if(e.age&&(S.age<e.age[0]||S.age>e.age[1]))return false;
    if(e.cond){try{if(!e.cond(S))return false;}catch(err){return false;}}
    return e.r===rarity;
  });
  if(pool.length===0){
    var o1=['daily','encounter','crisis','rare','destiny'];
    for(var i=0;i<o1.length;i++){
      pool=sceneList.filter(function(e){
        if(e.once&&hasSeen(e.id))return false;
        if(e.age&&(S.age<e.age[0]||S.age>e.age[1]))return false;
        if(e.cond){try{if(!e.cond(S))return false;}catch(err){return false;}}
        return e.r===o1[i];
      });
      if(pool.length>0)break;
    }
  }
  if(pool.length===0){
    var o2=['daily','encounter','crisis','rare'];
    for(var i2=0;i2<o2.length;i2++){
      for(var sk2 in SCENE_EVENTS){
        if(sk2==='special')continue;
        var cross=SCENE_EVENTS[sk2].filter(function(e){
          if(e.once&&hasSeen(e.id))return false;
          if(e.age&&(S.age<e.age[0]||S.age>e.age[1]))return false;
          if(e.cond){try{if(!e.cond(S))return false;}catch(err){return false;}}
          return e.r===o2[i2];
        });
        pool=pool.concat(cross);
      }
      if(pool.length>0)break;
    }
  }
  if(pool.length===0)return convertEvent(pick(DAILY_EVENTS));
  var ev=pick(pool);
  if(ev.once)S.seen.push(ev.id);
  return convertEvent(ev);
}
function pickEvent(){var ev=_pickEventInner();return prepareSpecialEvent(ev);}
function genEvent(){return convertEvent(pick(DAILY_EVENTS));}

function createPet(s,species,forceTier,forceName){
  if(s.pets.length>=5)return null;

  var cur=PET_TREE[species].stages[0];
  var tier=forceTier||rollTierForCompanion();
  var pet={species:species,stage:0,n:n,born:s.totalMonths,bond:30,kills:0,evoItems:{},hp:cur.hp*3,maxHp:cur.hp*3,aptitude:tier,growth:0,bonusAtk:0,destinyTalent:null,_justAdopted:true};
  if(tier==='神品'){var t=pick(PET_DESTINY_TALENTS);pet.destinyTalent={id:t.id,name:t.name,icon:t.icon,desc:t.desc};s.log.push('✦ 神品寵物！'+n+' 擁有天命天賦【'+t.name+'】');toast('✦ '+n+' 神品！',4000);}
  else if(tier==='絕品'&&chance(0.25)){var t2=pick(PET_DESTINY_TALENTS);pet.destinyTalent={id:t2.id,name:t2.name,icon:t2.icon,desc:t2.desc};s.log.push('✦ 絕品寵物 '+n+' 擁有天命天賦【'+t2.name+'】');}

function petAge(p){return Math.floor((S.totalMonths-p.born)/12);}
function nextStage(p){
  var tree=PET_TREE[p.species];if(!tree)return null;
  if(p.stage+1>=tree.stages.length)return null;
  return tree.stages[p.stage+1];
}
function getPetMaxHp(p){var tree=PET_TREE[p.species];if(!tree)return 10;var c=tree.stages[p.stage];return c?c.hp*3:10;}
function canEvolve(p){
  var n=nextStage(p);if(!n)return {ok:false,msg:'已達最終形態'};
  var need=n.need;
  if(petAge(p)<need.age)return {ok:false,msg:'需要年齡 '+need.age+' 歲'};
  if(p.bond<need.bond)return {ok:false,msg:'需要親密度 '+need.bond};
  if(p.kills<need.kills)return {ok:false,msg:'需要戰鬥勝利 '+need.kills+' 次'};
  for(var i=0;i<need.items.length;i++){if(!p.evoItems[need.items[i]]||p.evoItems[need.items[i]]<=0)return {ok:false,msg:'需要道具：'+need.items[i]};}
  return {ok:true};
}
function doEvolve(idx){
  var p=S.pets[idx];var chk=canEvolve(p);

  var n=nextStage(p);var need=n.need;
  for(var i=0;i<need.items.length;i++){p.evoItems[need.items[i]]--;if(p.evoItems[need.items[i]]<=0)delete p.evoItems[need.items[i]];}
  p.stage++;p.maxHp=getPetMaxHp(p);p.hp=p.maxHp;
  S.log.push('【寵物進化】'+p.n+' 進化為 '+n.n+'！');
  render();showPet(idx);saveGame();
}

/* ========== 師門武器與功法成長 ========== */
/* 神器/神功：特效一開始就有（依等級縮放），滿級全功率；每次升級真正加成屬性 */
function getDivineScale(item){
  if(!item)return 0;
  if(item.isDivine||(item.level||0)>=10)return 1;
  var lv=item.level||1;
  return Math.max(0.3, Math.min(1, lv/10));
}
function scaleDivineEffect(eff, scale){
  if(!eff)return null;
  var o={};for(var k in eff)o[k]=eff[k];
  o._scale=scale;
  if(typeof o.chance==='number')o.chance=Math.min(1, o.chance*scale);
  if(typeof o.heal==='number')o.heal=o.heal*scale;
  if(typeof o.value==='number')o.value=o.value*scale;
  if(typeof o.mult==='number')o.mult=1+(o.mult-1)*scale;
  if(typeof o.reduce==='number')o.reduce=o.reduce*scale;
  if(typeof o.threshold==='number')o.threshold=o.threshold+(1-o.threshold)*(1-scale)*0.3;
  return o;
}
function applyDivineBonusSubs(item, tpl, targetLevel){
  if(!tpl||!tpl.bonusSubs)return;
  if(!item._divineSubKeys)item._divineSubKeys={};
  tpl.bonusSubs.forEach(function(s){
    var full=s.val;
    var want=Math.max(1, Math.floor(full*(targetLevel/10)));
    var key=s.key;
    if(item._divineSubKeys[key]===undefined){
      item.subs.push({name:s.name,key:key,val:want,_divine:true});
      item._divineSubKeys[key]=want;
    }else{
      var prev=item._divineSubKeys[key];
      var delta=want-prev;
      if(delta>0){
        for(var i=0;i<item.subs.length;i++){
          if(item.subs[i].key===key&&item.subs[i]._divine){item.subs[i].val+=delta;break;}
        }
        item._divineSubKeys[key]=want;
      }
    }
  });
}
function attachDivineSeed(item, isWeapon){
  var tpl=isWeapon?DIVINE_MASTER_WEAPONS[item.baseName]:DIVINE_MASTER_SKILLS[item.baseName];
  if(!tpl)return;
  if(tpl.special)item.divineSpecial=tpl.special;
  applyDivineBonusSubs(item, tpl, item.level||1);
}
function gainWeaponExp(weapon,amount){
  if(!weapon||!weapon.isMasterWeapon)return false;
  if(weapon.level===undefined){weapon.level=1;weapon.exp=0;weapon.expNext=100;}
  if(weapon.level>=10)return false;
  weapon.exp=(weapon.exp||0)+amount;
  var up=false;
  while(weapon.level<10&&weapon.exp>=weapon.expNext){
    weapon.exp-=weapon.expNext;weapon.level++;weapon.expNext=Math.floor(weapon.expNext*1.55);
    // 主屬性隨等級實質成長
    weapon.main.val+=3+Math.floor(weapon.level*0.8);
    if(weapon.level%2===0&&weapon.subs.length<6){
      var a=pick(MAIN_ATTRS);weapon.subs.push({name:a.name,key:a.key,val:2+Math.floor(weapon.level*0.9)});
    }
    var tiers=['凡品','良品','上品','絕品','神品'],ti=tiers.indexOf(weapon.tier);
    if(weapon.level%3===0&&ti<4)weapon.tier=tiers[ti+1];
    // 神話加成隨等級推進
    var tpl=DIVINE_MASTER_WEAPONS[weapon.baseName];
    if(tpl){applyDivineBonusSubs(weapon,tpl,weapon.level);if(!weapon.divineSpecial&&tpl.special)weapon.divineSpecial=tpl.special;}
    up=true;if(S&&S.log)S.log.push('【師門武器】'+weapon.name+' 成長至 Lv.'+weapon.level+'！主屬性 +'+(3+Math.floor(weapon.level*0.8)));
  }
  if(weapon.level>=10&&!weapon.isDivine){
    weapon.isDivine=true;weapon.tier='神品';weapon.name='【神器】'+weapon.baseName;weapon.main.val+=25;
    var tpl2=DIVINE_MASTER_WEAPONS[weapon.baseName];
    if(tpl2){applyDivineBonusSubs(weapon,tpl2,10);weapon.divineSpecial=tpl2.special;}
    if(S&&S.log)S.log.push('✦ 師門武器突破，成為傳說神器！ ✦');
    if(weapon.divineSpecial)if(S&&S.log)S.log.push('✦ 神器全功率：【'+weapon.divineSpecial.name+'】'+weapon.divineSpecial.desc);
    toast('✦ 神器認主！'+weapon.baseName+' 已成神兵 ✦',3500);
    unlockAchievement('weapon_max');
  }
  return up;
}

function scoreEquipItem(eq){

  var sc=(eq.main.val||0)*2*(tierM[eq.tier]||1);
  (eq.subs||[]).forEach(function(s){sc+=(s.val||0)*(tierM[eq.tier]||1);});
  if(eq.level)sc+=eq.level*3;
  if(eq.isMasterWeapon)sc+=80;
  if(eq.isSetPiece)sc+=40;
  if(eq.setBreakthrough)sc+=60;
  if(eq.isDivine)sc+=50;
  return Math.floor(sc);
}

function findMaster(name){for(var i=0;i<MASTERS.length;i++)if(MASTERS[i].name===name)return MASTERS[i];return null;}
function getEligibleMasters(){
  var align=getAlignmentValue(),eligible=[];
  if(S.master)return eligible;if(S.exileCount>=2)return eligible;
  if(!S.exiledFrom){if(align>=20)eligible=MASTERS.filter(function(m){return m.side==='正道';});else if(align<=-20)eligible=MASTERS.filter(function(m){return m.side==='邪道';});}
  else{if(S.exiledFrom==='正道'&&align<=-20)eligible=MASTERS.filter(function(m){return m.side==='邪道'&&m.name!==S.master0Name;});else if(S.exiledFrom==='邪道'&&align>=20)eligible=MASTERS.filter(function(m){return m.side==='正道'&&m.name!==S.master0Name;});}
  return eligible;
}
function tryMasterEncounter(){
  if(S.age<16)return false;
  if(S.master){
    if(!chance(0.02))return false;
    var met=(S.destinyMasters||[]).map(function(d){return d.name;});
    var others=MASTERS.filter(function(m){
      return m.name!==S.master.name&&m.name!==S.master0Name&&met.indexOf(m.name)<0;
    });
    if(!others.length)return false;
    S.destinyEncounterPending=pick(others);
    return true;
  }
  if(S.exileCount>=2)return false;
  var el=getEligibleMasters();if(el.length===0)return false;
  if(!chance(0.025))return false;S.masterEncounterPending=pick(el);return true;
}

function checkMasterTask(){
  if(!S.master)return false;

  var rk=['記名','親傳','關門'][S.master.rank];

function executeMasterTaskWisdom(){

  return[{name:'基本攻擊',type:'拳法',bonus:8,mpCost:3}];
}
function calcEnemyStrength(basePower,source){
  var pAtk=totalAtk()+totalDef(),pHP=getTotalMaxHp();
  var pf=1.0;
  if(source==='normal'||source==='event')pf=0.7;else if(source==='bounty')pf=1.1;
  else if(source==='master')pf=1.2;else if(source==='hunt')pf=1.6;
  else if(source==='abandoned_revenge')pf=1.3;
  else if(source==='tower')pf=1.0;
  // 低齡與低級弟子大幅降低難度，避免10歲必死
  if(S&&S.age<14)pf*=0.35;
  else if(S&&S.age<18)pf*=0.55;
  // 晚年敵力急升：60歲後翻倍，90歲再翻倍
  if(S&&S.age>=90)pf*=4;
  else if(S&&S.age>=60)pf*=2;
  if(source==='master'&&S&&S.master){
    if(S.master.rank===0)pf*=0.6;
    else if(S.master.rank===1)pf*=0.85;
  }
  var tot=pAtk*2+pHP,et=tot*pf;
  var hp=Math.floor(et*0.7*(0.85+Math.random()*0.3));
  var atk=Math.floor(et*0.25*(0.85+Math.random()*0.3));
  var def=Math.floor(et*0.15*(0.85+Math.random()*0.3));
  return {hp:Math.max(20,hp),atk:Math.max(3,atk),def:Math.max(2,def)};
}
function canPartnerFight(){return S.partner&&!S.partnerDead&&(S.partner.stage==='相戀'||S.partner.stage==='夫妻')&&S.partner.hp>0;}
function getPartnerBattleStats(){
  if(!canPartnerFight())return null;
  var p=S.partner;
  var sm=(p.stage==='夫妻')?1.0:0.6;
  var am=getAptMult(p.aptitude||'凡品');
  var base=20+Math.floor(p.love/3)+(p.traitKey==='martial'?p.traitVal*2:0);
  var atk=Math.floor(base*sm*am);
  var hpMax=Math.floor(100*am);
  var hpCur=Math.floor(p.hp*am);
  return {name:p.name,hp:hpCur,maxHp:hpMax,atk:atk,def:5,stage:p.stage,destinyTalent:p.destinyTalent||null,aptitude:p.aptitude||'凡品',statuses:{}};
}
function getPetBattleStats(){
  var list=[];
  S.pets.slice(0,5).forEach(function(p){
    var _tree=PET_TREE[p.species];
    if(!_tree||!_tree.stages[p.stage])return;
    var cur=_tree.stages[p.stage];
    if(p.maxHp===undefined||p.maxHp===null)p.maxHp=cur.hp*3;
    if(p.hp===undefined||p.hp===null)p.hp=p.maxHp;
    if(p.bonusAtk===undefined)p.bonusAtk=0;
    var mult=getAptMult(p.aptitude);
    var fAtk=Math.floor((cur.atk+p.bonusAtk)*mult);
    var fMax=Math.floor(p.maxHp*mult);
    var hpCur=Math.floor(p.hp*mult);
    list.push({name:p.n,hp:Math.max(0,Math.min(hpCur,fMax)),maxHp:fMax,atk:fAtk,def:Math.floor(fAtk/3),skill:cur.skill,ref:p,destinyTalent:p.destinyTalent||null,aptitude:p.aptitude||'凡品',statuses:{}});
  });
  return list;
}
function startBattle(name,hp,atk,def,source){
  if(hp===undefined||hp===null||hp<=0){
    var s=calcEnemyStrength(0,source||'normal');
    hp=s.hp;atk=s.atk;def=s.def;
  }
  var _eAd=getSetSpecialValue('enemy_atk_down'),_eDd=getSetSpecialValue('enemy_def_down');
  var _mpt=getSetSpecialValue('money_per_turn'),_rpt=getSetSpecialValue('regen_per_turn'),_es=getSetSpecialValue('enemy_slow');
  atk=Math.max(1,Math.floor(atk*(1-_eAd)));
  def=Math.max(1,Math.floor(def*(1-_eDd)));
  var _dE=[];
  for(var _s in S.equip){
    var _e=S.equip[_s];
    if(_e&&_e.divineSpecial){
      var _sc=typeof getDivineScale==='function'?getDivineScale(_e):1;
      _dE.push(typeof scaleDivineEffect==='function'?scaleDivineEffect(_e.divineSpecial,_sc):_e.divineSpecial);
    }
  }
  S.skills.forEach(function(_sk){
    if(_sk.divineSpecial){
      var _sc2=typeof getDivineScale==='function'?getDivineScale(_sk):1;
      _dE.push(typeof scaleDivineEffect==='function'?scaleDivineEffect(_sk.divineSpecial,_sc2):_sk.divineSpecial);
    }
  });
  BATTLE={
    divineEffects:_dE,divineState:{},source:source||'normal',
    isMasterTask:(source==='master'),
    player:{name:S.playerName,hp:S.hp,maxHp:getTotalMaxHp(),mp:Math.max(20,S.inner*3),maxMp:Math.max(20,S.inner*3),atk:totalAtk(),def:totalDef(),skills:getPlayerBattleSkills(),martialBuff:false,martialBuffMult:null,undyingUsed:false,undyingTurns:0,wushenTriggers:0,dodgeCount:0,undyingTriggered:false,lastAction:'',statuses:{}},
    partner:getPartnerBattleStats(),pets:getPetBattleStats(),
    enemy:{name:name,hp:hp,maxHp:hp,atk:atk,def:def,mp:100,maxMp:100,skills:generateEnemySkills(name),statuses:{}},
    turn:0,log:[],auto:false,done:false,result:null,
    isHunt:(source==='hunt')||name.indexOf('追殺者')>=0,
    coupleDamageTotal:0,coupleHealedLastTurn:0,
    isAbandonedRevenge:(source==='abandoned_revenge'),
    setMoneyPerTurn:_mpt,setRegenPerTurn:_rpt,enemySlowChance:_es,
    setBonusApplied:{atkDown:_eAd,defDown:_eDd}
  };
  document.getElementById('tabsBar').style.display='none';
  renderBattle();
  try{tryAutoStartBattle();}catch(e){}
}
function pickPlayerSkill(){
  var b=BATTLE;
  var av=b.player.skills.filter(function(sk){return sk.mpCost<=b.player.mp;});
  if(av.length===0)return {name:'基礎拳腳',type:'拳法',bonus:5,mpCost:0};

}
function pickEnemyTarget(b){
  if(b.player.hp>0)return {type:'player',hp:b.player.hp,ref:b.player};
  var ap=b.pets.filter(function(p){return p.hp>0;});
  if(ap.length>0){var p=pick(ap);return {type:'pet',hp:p.hp,ref:p,name:p.name};}
  if(b.partner&&b.partner.hp>0)return {type:'partner',hp:b.partner.hp,ref:b.partner};

}
function checkTotalWipe(b){
  if(b.player.hp>0)return false;
  if(b.pets.some(function(p){return p.hp>0;}))return false;
  if(b.partner&&b.partner.hp>0)return false;

function battleTurn(){
  var b=BATTLE;if(!b||b.done)return;
  b.turn++;b.player.lastAction='';b.coupleDamageTotal=0;b.coupleHealedLastTurn=0;
  tickStatuses(b.player,b.log);
  if(b.player.undyingTurns>0){
    b.player.undyingTurns--;
    if(b.player.hp<1)b.player.hp=1;
    if(b.player.undyingTurns>0)b.log.push({who:'system',skill:'🔥 不死之身·剩餘 '+b.player.undyingTurns+' 回合 🔥'});
    else b.log.push({who:'system',skill:'不死之身效果結束'});
  }
  if(b.setRegenPerTurn&&b.player.hp>0&&b.player.hp<b.player.maxHp){
    var ra=Math.floor(b.player.maxHp*b.setRegenPerTurn);
    if(ra>0){b.player.hp=Math.min(b.player.maxHp,b.player.hp+ra);b.log.push({who:'system',skill:'🕯 不滅之軀：恢復 '+ra+' 點生命 🕯'});}
  }
  if(b.setMoneyPerTurn&&b.setMoneyPerTurn>0){S.money+=b.setMoneyPerTurn;b.log.push({who:'system',skill:'💰 富貴逼人：獲得 '+b.setMoneyPerTurn+' 兩 💰'});}
  if(!b.divineState)b.divineState={};
  b.divineEffects.forEach(function(eff){
    if(eff.type==='regen_chance'&&b.player.hp>0&&b.player.hp<b.player.maxHp&&chance(eff.chance)){
      var h=Math.floor(b.player.maxHp*eff.heal);b.player.hp=Math.min(b.player.maxHp,b.player.hp+h);
      b.log.push({who:'system',skill:'✦ 太極護體：回復 '+h+' 點生命 ✦'});
    }
    if(eff.type==='cleanse_heal'&&b.player.hp>0&&b.player.hp<b.player.maxHp){
      var cleared=clearOneBadStatus(b.player);
      var h2=Math.floor(b.player.maxHp*eff.heal);b.player.hp=Math.min(b.player.maxHp,b.player.hp+h2);
      b.log.push({who:'system',skill:'✦ 掃盡凡塵：回復 '+h2+' 點生命'+(cleared?'　清除 1 個負面狀態':'')+' ✦'});
    }
    if(eff.type==='periodic_double'){
      if(!b.divineState['pd_'+eff.id])b.divineState['pd_'+eff.id]=0;
      b.divineState['pd_'+eff.id]++;
      if(b.divineState['pd_'+eff.id]>=eff.interval){
        b.divineState['pd_'+eff.id]=0;b.player.martialBuff=true;b.player.martialBuffMult=2;
        b.log.push({who:'system',skill:'✦ 重劍無鋒：本回合傷害翻倍 ✦'});
      }
    }
    if(eff.type==='dot'&&b.enemy.hp>0){
      var d=Math.floor(b.enemy.maxHp*eff.value);b.enemy.hp=Math.max(0,b.enemy.hp-d);
      b.log.push({who:'system',skill:'✦ 萬毒侵蝕：對敵人造成 '+d+' 點毒傷 ✦'});
    }
    if(eff.type==='poison_burst'&&b.enemy.hp>0&&chance(eff.chance)){
      var pb=Math.floor(b.enemy.maxHp*eff.value);b.enemy.hp=Math.max(0,b.enemy.hp-pb);
      b.log.push({who:'system',skill:'✦ 萬毒噬心：對敵人造成 '+pb+' 點毒傷 ✦'});
    }
    if(eff.type==='first_strike'&&b.turn===1&&!b.divineState.fs){
      b.divineState.fs=true;b.player.martialBuff=true;b.player.martialBuffMult=eff.mult;
      b.log.push({who:'system',skill:'✦ 先手必勝：第一擊傷害 ×'+eff.mult+' ✦'});
    }
    if(eff.type==='early_burst'&&b.turn<=eff.turns){
      if(!b.divineState['eb_'+b.turn]){
        b.divineState['eb_'+b.turn]=true;b.player.martialBuff=true;b.player.martialBuffMult=eff.mult;
        b.log.push({who:'system',skill:'✦ 先發制人：本回合傷害 ×'+eff.mult+' ✦'});
      }
    }
  });
  if(b.enemy.hp>0){
    var hasSP=b.divineEffects.some(function(e){return e.type==='poison';});
    if(hasSP){var se=b.divineEffects.filter(function(e){return e.type==='poison';})[0];var sd=Math.floor(b.enemy.maxHp*se.value);b.enemy.hp=Math.max(0,b.enemy.hp-sd);b.log.push({who:'system',skill:'✦ 蛇毒噬心：敵人受到 '+sd+' 點毒傷 ✦'});}
  }
  if(hasTalent('武神轉世')&&b.player.hp>0&&!b.player.martialBuff&&chance(0.3)){
    b.player.martialBuff=true;b.player.wushenTriggers++;b.player.lastAction='martial';

  }
  if(b.player.hp>0){
    if(hasStatus(b.player,'paralyze')){
      b.log.push({who:'system',skill:'⚡ 你被麻痺，無法行動！'});
    } else if(hasStatus(b.player,'confuse')){
      var selfDmg=Math.max(1,Math.floor(b.player.atk*0.5));
      b.player.hp=Math.max(0,b.player.hp-selfDmg);
      b.log.push({who:'system',skill:'? 你陷入混亂，攻擊自己 '+selfDmg+' 點！'});
    } else {
      var ps=pickPlayerSkill();
      b.player.mp=Math.max(0,b.player.mp-ps.mpCost);
      var dmg1=Math.max(1,Math.floor(b.player.atk*0.6+ps.bonus*1.5+rnd(15)));
      if(b.player.martialBuff){
        var m=b.player.martialBuffMult||2;dmg1=Math.floor(dmg1*m);b.player.martialBuff=false;b.player.martialBuffMult=null;
      }
      b.divineEffects.forEach(function(eff){
        if(eff.type==='ignore_def'&&chance(eff.chance)){

      b.enemy.hp-=dmg1;if(b.enemy.hp<0)b.enemy.hp=0;
      b.log.push({who:'player',skill:ps.name,dmg:dmg1});
      b.coupleDamageTotal+=dmg1;

      b.divineEffects.forEach(function(eff){
        if(eff.type==='extra_attack'&&b.enemy.hp>0){
          var ex=Math.max(1,Math.floor(dmg1*eff.mult*0.6));b.enemy.hp-=ex;if(b.enemy.hp<0)b.enemy.hp=0;
          b.log.push({who:'player',skill:'✦ 劍意通神・連擊',dmg:ex});
          b.coupleDamageTotal+=ex;
        }
        if(eff.type==='double_attack'&&b.enemy.hp>0&&chance(eff.chance)){
          var db=Math.max(1,Math.floor(dmg1*0.8));b.enemy.hp-=db;if(b.enemy.hp<0)b.enemy.hp=0;
          b.log.push({who:'player',skill:'✦ 絕技連環・追加',dmg:db});
          b.coupleDamageTotal+=db;
        }
        if(eff.type==='apply_poison'&&b.enemy.hp>0&&chance(eff.chance)){

          b.log.push({who:'system',skill:'☠ 萬毒噬心：敵人中毒！'});
        }
      });
    }
  }
  if(b.partner&&b.partner.hp>0){
    tickStatuses(b.partner,b.log);
    if(!hasStatus(b.partner,'paralyze')){
      var pB=Math.max(1,Math.floor(b.partner.atk*0.5+rnd(10)));
      var pA=pB;
      var pl=(b.partner.stage==='夫妻')?'齊心協力':'情意綿綿';
      var dt=b.partner.destinyTalent;
      if(dt&&dt.id==='ptd_double'){pA=Math.floor(pB*1.8);pl+='（琴瑟和鳴）';}
      if(dt&&dt.id==='ptd_lowhp'&&b.player.hp>0&&b.player.hp<b.player.maxHp*0.3){pA=Math.floor(pA*3);pl+='（生死相依）';}
      b.enemy.hp-=pA;if(b.enemy.hp<0)b.enemy.hp=0;
      b.log.push({who:'partner',skill:pl,dmg:pA});
      b.coupleDamageTotal+=pA;
    }
  }
  b.pets.forEach(function(p){
    if(p.hp<=0)return;
    tickStatuses(p,b.log);
    if(hasStatus(p,'paralyze'))return;
    if(p.destinyTalent&&p.destinyTalent.id==='pd_regen'){
      var rg=Math.floor(p.maxHp*0.15);p.hp=Math.min(p.maxHp,p.hp+rg);
      b.log.push({who:'system',skill:'💚 '+p.name+' 生生不息：恢復 '+rg+' 點生命'});
    }
    if(p.destinyTalent&&p.destinyTalent.id==='pd_master_guard'&&b.player.hp>0&&b.player.hp<b.player.maxHp*0.3){
      var mh=Math.floor(b.player.maxHp*0.05);b.player.hp=Math.min(b.player.maxHp,b.player.hp+mh);
      b.log.push({who:'system',skill:'🛡 '+p.name+' 獸魂護主：為你回復 '+mh+' 點生命'});
    }
    var skill=p.skill||{name:'攻擊',mult:1};
    var mult=1;
    if(p.destinyTalent&&p.destinyTalent.id==='pd_atk_double'&&chance(0.3)){mult*=2;b.log.push({who:'system',skill:'⚡ '+p.name+' 狂暴獸魂：傷害翻倍！'});}
    var di=0;
    if(p.destinyTalent&&p.destinyTalent.id==='pd_break')di=0.5;
    var pa=Math.max(1,Math.floor(p.atk*0.7*skill.mult*mult+rnd(8)));
    if(di>0)pa+=Math.floor(b.enemy.def*di);
    b.enemy.hp-=pa;if(b.enemy.hp<0)b.enemy.hp=0;
    b.log.push({who:'pet',skill:p.name+'·'+skill.name+(mult>1?'（狂暴）':'')+(di>0?'（破甲）':''),dmg:pa});
  });
  if(b.partner&&b.partner.hp>0&&b.player.hp>0&&S.partner&&!S.partnerDead&&S.partner.stage==='夫妻'){
    var cd=b.coupleDamageTotal;
    if(cd>0){
      var cr=0.5;
      if(b.partner.destinyTalent&&b.partner.destinyTalent.id==='ptd_couple_up')cr=0.8;
      var ha=Math.floor(cd*cr);
      if(ha>0){
        var pB2=b.player.hp,pB3=b.partner.hp;
        b.player.hp=Math.min(b.player.maxHp,b.player.hp+ha);
        b.partner.hp=Math.min(b.partner.maxHp,b.partner.hp+ha);
        var ph=b.player.hp-pB2,ph2=b.partner.hp-pB3;
        if(ph>0||ph2>0){
          b.log.push({who:'system',skill:'💞 夫妻功法（被動）：本回合功法傷害合計 '+cd+' → 轉化生命（你 +'+ph+'　'+b.partner.name+' +'+ph2+'）'});
          b.coupleHealedLastTurn=1;
        }
      }
    }
  }
  if(b.enemy.hp<=0){
    b.divineEffects.forEach(function(eff){
      if(eff.type==='kill_heal'){
        var h=Math.floor(b.player.maxHp*eff.value);b.player.hp=Math.min(b.player.maxHp,b.player.hp+h);
        b.log.push({who:'system',skill:'✦ 化功：擊敗敵人，回復 '+h+' 點生命 ✦'});
      }
    });
    endBattle(true);return;
  }
  if(hasTalent('氣運之子')&&b.player.hp>0&&chance(0.06)){
    b.player.dodgeCount++;b.player.lastAction='dodge';
    b.log.push({who:'system',skill:'💫 氣運之子·完全閃避！ 💫'});
    if(b.player.dodgeCount>=3)unlockAchievement('dodge_3');
    renderBattle();
    if(b.auto&&!b.done)setTimeout(battleTurn,typeof autoDelay==='function'?autoDelay():900);
    return;
  }
  if(b.enemySlowChance>0&&chance(b.enemySlowChance)){
    b.log.push({who:'system',skill:'🍀 天命壓制：敵人無法出手！ 🍀'});
    renderBattle();
    if(b.auto&&!b.done)setTimeout(battleTurn,typeof autoDelay==='function'?autoDelay():900);
    return;
  }
  tickStatuses(b.enemy,b.log);
  if(b.enemy.hp<=0){endBattle(true);return;}
  if(hasStatus(b.enemy,'paralyze')){
    b.log.push({who:'system',skill:'⚡ 敵人被麻痺，無法出手！'});
    renderBattle();
    if(b.auto&&!b.done)setTimeout(battleTurn,typeof autoDelay==='function'?autoDelay():700);
    return;
  }
  var target=pickEnemyTarget(b);
  if(!target){endBattle(false);return;}
  var es=pick(b.enemy.skills);
  var dmg=Math.max(1,Math.floor(b.enemy.atk*0.5*statusAtkMult(b.enemy)+es.bonus*1.2+rnd(10)));
  if(target.type==='player'){
    var dodged=false;
    b.divineEffects.forEach(function(eff){
      if(eff.type==='dodge'&&!dodged&&chance(eff.chance)){dodged=true;b.log.push({who:'system',skill:'✦ 極速身法：完全閃避！ ✦'});}
    });
    if(dodged){renderBattle();if(b.auto&&!b.done)setTimeout(battleTurn,typeof autoDelay==='function'?autoDelay():900);return;}
    if(b.partner&&b.partner.hp>0&&b.partner.destinyTalent&&b.partner.destinyTalent.id==='ptd_guard'){
      var bl=Math.floor(dmg*0.3);dmg=Math.max(1,dmg-bl);
      b.log.push({who:'system',skill:'🛡 '+b.partner.name+' 心心相印：為你抵擋 '+bl+' 點傷害'});
    }
    b.divineEffects.forEach(function(eff){
      if(eff.type==='damage_reduce'&&chance(eff.chance)){
        var rd=Math.floor(dmg*eff.reduce);dmg=Math.max(1,dmg-rd);
        b.log.push({who:'system',skill:'✦ 太極化勁：減免 '+rd+' 點傷害 ✦'});
      }
    });
    b.divineEffects.forEach(function(eff){
      if(eff.type==='weaken'&&chance(eff.chance)){
        addStatus(b.enemy,'weaken',2);
        b.log.push({who:'system',skill:'✦ 經脈反噬：敵人虛弱！ ✦'});
      }
    });
    b.divineEffects.forEach(function(eff){
      if(eff.type==='reflect'&&b.enemy.hp>0){
        var rf=Math.floor(dmg*eff.value);b.enemy.hp=Math.max(0,b.enemy.hp-rf);
        b.log.push({who:'system',skill:'✦ 逆運經脈：反彈 '+rf+' 點傷害 ✦'});
      }
    });
    b.player.hp-=dmg;if(b.player.hp<0)b.player.hp=0;
    b.log.push({who:'enemy',skill:es.name,dmg:dmg,target:'player'});
    if(es.status&&b.player.hp>0){
      if(chance(0.5)){
        addStatus(b.player,es.status);
        b.log.push({who:'system',skill:'☠ 你受到【'+STATUS_DEFS[es.status].name+'】效果！'});
      }
    }
    if(b.player.hp<=0){
      var uw=false;
      b.divineEffects.forEach(function(eff){
        if(eff.type==='undying_once'&&!b.divineState.qiwall){
          b.divineState.qiwall=true;b.player.hp=1;uw=true;
          b.log.push({who:'system',skill:'✦ 無形氣牆：鎖血 1 點！ ✦'});
        }
      });
      if(!uw&&b.player.hp<=Math.floor(b.player.maxHp*0.25)){
        b.divineEffects.forEach(function(eff){
          if(eff.type==='last_stand_heal'&&!b.divineState.ls){
            b.divineState.ls=true;
            var h=Math.floor(b.player.maxHp*eff.heal);b.player.hp=Math.min(b.player.maxHp,b.player.hp+h);
            b.log.push({who:'system',skill:'✦ 純陽不滅：回復 '+h+' 點生命 ✦'});
            uw=true;
          }
        });
      }
      if(!uw){
        if(hasTalent('不死之身')&&!b.player.undyingUsed){
          b.player.hp=1;b.player.undyingUsed=true;b.player.undyingTriggered=true;b.player.undyingTurns=5;b.player.lastAction='undying';
          b.log.push({who:'system',skill:'🕯️ 不死之身！鎖血 1 點，5 回合不死 🕯️'});
          S.achieveStats.battleUsesUndying=(S.achieveStats.battleUsesUndying||0)+1;
        }else if(b.player.undyingTurns>0){b.player.hp=1;}
        else b.log.push({who:'system',skill:'💀 你倒下了！'});
      }
    }
  }else if(target.type==='partner'){
    b.partner.hp-=dmg;if(b.partner.hp<0)b.partner.hp=0;
    b.log.push({who:'enemy',skill:es.name,dmg:dmg,target:'partner'});
    if(es.status&&b.partner.hp>0&&chance(0.5))addStatus(b.partner,es.status);
  }else{
    if(target.ref.destinyTalent&&target.ref.destinyTalent.id==='pd_dodge'&&chance(0.15)){
      b.log.push({who:'system',skill:'💨 '+target.name+' 靈動身法：完全閃避！'});
    }else{
      target.ref.hp-=dmg;if(target.ref.hp<0)target.ref.hp=0;
      b.log.push({who:'enemy',skill:es.name,dmg:dmg,target:'pet',targetName:target.name});
      if(es.status&&target.ref.hp>0&&chance(0.4))addStatus(target.ref,es.status);
    }
  }
  if(checkTotalWipe(b)){endBattle(false);return;}
  renderBattle();
  if(b.auto&&!b.done)setTimeout(battleTurn,typeof autoDelay==='function'?autoDelay():700);
}
function killPartner(reason,age){
  if(!S||!S.partner||S.partnerDead)return;
  S.partnerDead=true;
  S.partner.deathReason=reason;
  S.partner.deathAge=age||S.age;
  S.partner.stage='亡故';
  S.calm=Math.max(0,S.calm-20);
  S.stress=Math.min(100,S.stress+30);
  S.log.push('【伴侶】'+S.partner.name+'離你而去……');
}
function endBattle(win){
  var b=BATTLE;if(!b)return;
  b.done=true;b.result=win;
  if(win){if(b.isHunt)unlockAchievement('godslayer');S.battleWins=(S.battleWins||0)+1;S.hp=Math.max(1,b.player.hp);}
  else S.hp=0;
  if(b.partner&&S.partner){
    var am=getAptMult(S.partner.aptitude||'凡品');
    S.partner.hp=Math.max(0,Math.floor(b.partner.hp/am));
    if(S.partner.hp<=0&&!S.partnerDead)killPartner('為你擋下致命一擊，傷重不治');
  }
  b.pets.forEach(function(p){if(p.ref)p.ref.hp=p.hp;});
  if(win){
    S.money+=moneyGain(20+rnd(50));S.fame+=5;
    if(!S.hasAuctionTicket){
      var fg=1+rnd(2);S.auctionFragments=(S.auctionFragments||0)+fg;
      if(S.auctionFragments>=AUCTION_TICKET_FRAGMENTS_NEEDED){
        S.auctionFragments=0;S.hasAuctionTicket=true;
        S.log.push('✦✦✦ 集齊碎片，合成【拍賣行入場券】！ ✦✦✦');
        toast('✦ 獲得拍賣行入場券！ ✦',6000);
      }
    }
    S.pets.forEach(function(p){p.kills++;});
    if(chance(.4)){var lt=genEquip(pick(Object.keys(SLOT_DEF)));var lr=addToBagEquip(lt);if(!lr.sold)b.loot=lt;else b.lootSold=lr.price;}
    if(chance(.35)){var ed=pick(EVO_ITEMS);if(S.pets.length>0){var pp=pick(S.pets);pp.evoItems[ed]=(pp.evoItems[ed]||0)+1;}b.evoDrop=ed;}
    for(var s in S.equip){
      var eq=S.equip[s];if(!eq)continue;
      var ge=30+rnd(50)+Math.floor(S.age/3);
      if(eq.isMasterWeapon){
        var up=gainWeaponExp(eq,ge);
        if(up&&b.log)b.log.push({who:'system',skill:'🗡️ '+eq.name+' 成長至 Lv.'+eq.level+' 🗡️'});
      }else{
        var upg=gainGenericEquipExp(eq,Math.floor(ge*0.75));
        if(upg&&b.log)b.log.push({who:'system',skill:'🛡️ '+eq.name+' → Lv.'+(eq.level||'?')});
      }
    }
    S.skills.forEach(function(sk){
      if(!sk)return;
      var se=20+rnd(30)+Math.floor(S.age/4);
      if(sk.isMasterSkill){
        var up2=gainSkillExp(sk,se);
        if(up2&&b.log)b.log.push({who:'system',skill:'📜 '+sk.name+' 成長至 Lv.'+sk.level+' 📜'});
      }else{
        var up3=gainGenericSkillExp(sk,Math.floor(se*0.7));
        if(up3&&b.log)b.log.push({who:'system',skill:'📘 '+sk.name+' → Lv.'+(sk.level||'?')});
      }
    });
    if(b.player.hp<=1&&b.player.undyingTriggered&&!hasAchievement('last_stand'))unlockAchievement('last_stand');
  }else{
    if(b.isHunt){S.hp=0;S.money=Math.floor(S.money*0.7);S.stress+=20;}
    if(b.isAbandonedRevenge){S.money=Math.floor(S.money*0.8);S.stress+=15;}
  }
  checkAchievements();
  renderBattle();saveGame();
}
function battleAuto(){if(!BATTLE||BATTLE.done)return;BATTLE.auto=true;battleTurn();}
function battleFlee(){
  if(!BATTLE||BATTLE.done)return;
  if(BATTLE.isHunt){toast('師父追殺，無法逃跑！');return;}
  if(BATTLE.isAbandonedRevenge){toast('棄子復仇，無法逃跑！');return;}
  if(BATTLE.isTower){toast('時空之塔中無法逃跑！');return;}
  if(chance(0.5)){
    S.hp=Math.max(1,Math.floor(BATTLE.player.hp*0.8));
    BATTLE.pets.forEach(function(p){if(p.ref)p.ref.hp=Math.max(0,p.hp);});
    if(BATTLE.partner&&S.partner&&!S.partnerDead){
      var am=getAptMult(S.partner.aptitude||'凡品');
      S.partner.hp=Math.max(0,Math.floor(BATTLE.partner.hp/am));
      if(S.partner.hp<=0&&!S.partnerDead)killPartner('為你擋下致命一擊');
    }
    S.fame=Math.max(0,S.fame-5);
    BATTLE.done=true;BATTLE.result='flee';
    BATTLE.log.push({who:'system',skill:'逃跑成功'});
    renderBattle();
  }else{
    BATTLE.log.push({who:'system',skill:'逃跑失敗'});
    var es=pick(BATTLE.enemy.skills);
    var dmg=Math.max(1,Math.floor(BATTLE.enemy.atk*0.5+es.bonus*1.2+rnd(10)));
    BATTLE.player.hp-=dmg;if(BATTLE.player.hp<0)BATTLE.player.hp=0;
    BATTLE.log.push({who:'enemy',skill:es.name,dmg:dmg,target:'player'});
    if(BATTLE.player.hp<=0){
      if(checkTotalWipe(BATTLE)){endBattle(false);return;}
    }
    renderBattle();
  }
}
function closeBattle(){
  document.getElementById('tabsBar').style.display='flex';
  if(!BATTLE)return;
  var result=BATTLE.result,avengerRef=BATTLE.avengerRef,avengerAge=BATTLE.avengerAge;
  var isMT=BATTLE.isMasterTask,mtRef=BATTLE.masterTaskRef;
  var wasTower=BATTLE.isTower,towerFloor=BATTLE.towerFloor;
  BATTLE=null;
  if(wasTower){
    if(result===true){
      onTowerBattleWin();
      TAB='tower';renderTower();render();saveGame();
      return;
    }else if(result==='flee'){
      toast('塔中不可逃跑');TAB='tower';renderTower();render();return;
    }else{
      // 战败：不掉层，可重试；不强退
      S.hp=Math.max(1,Math.floor(getTotalMaxHp()*0.2));
      S.log.push('【時空之塔】第 '+(towerFloor||'?')+' 層挑戰失敗，養精蓄銳後可再試。');
      toast('挑戰失敗，可再試本層',2500);
      TAB='tower';renderTower();render();saveGame();
      return;
    }
  }
  if(avengerRef&&avengerAge!==undefined){
    var age=Math.floor((S.totalMonths-avengerRef.bornMonth)/12);
    if(result===true){avengerRef.log.push({age:age,text:'偷襲父母失敗。',tag:'復仇失敗'});avengerRef.deeds.push({type:'revenge_player_fail',age:age});}
    else if(result==='flee'){avengerRef.log.push({age:age,text:'偷襲父母，父母逃離。',tag:'復仇'});avengerRef.deeds.push({type:'revenge_player_flee',age:age});}
    else{avengerRef.log.push({age:age,text:'成功偷襲父母。',tag:'復仇成功'});avengerRef.deeds.push({type:'revenge_player_win',age:age});}
  }
  if(result===false){
    if(S.age<18){
      S.hp=Math.max(1,Math.floor(getTotalMaxHp()*0.15));
      S.stress=Math.min(100,(S.stress||0)+25);
      S.money=Math.max(0,(S.money||0)-Math.floor((S.money||0)*0.1));
      S.log.push('【重傷】你在戰鬥中重傷倒地，僥倖保住性命。');
      toast('重傷倖存！血量與壓力受損',3000);
      clampMoney();
      nextMonth();
      return;
    }
    endGame('戰死江湖');return;
  }
  if(isMT&&mtRef){
    MASTER_TASK=mtRef;
    MASTER_TASK.success=(result===true);
    finishMasterTask();
    return;
  }
  nextMonth();
}
function renderBattle(){
  var b=BATTLE;if(!b)return;
  var el=document.getElementById('event');
  var hpP=Math.max(0,b.player.hp/b.player.maxHp*100);
  var ehpP=Math.max(0,b.enemy.hp/b.enemy.maxHp*100);
  var pCls='battleChar player';
  if(b.player.hp>0){
