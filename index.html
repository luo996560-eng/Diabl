/* ========== 月度成長 ========== */
function checkPartnerDeath(){
  if(!S.partner||S.partnerDead)return;
  var p=S.partner;
  if(p.hp<=0){killPartner('為你擋下致命一擊');return;}
    if(p.hp<100)p.hp=Math.min(100,p.hp+2);
}
function partnerMonthlyGrowth(){
  if(!S.partner||S.partnerDead)return;
  var p=S.partner;
  // 初始化戰鬥屬性欄位
  if(p.martial===undefined)p.martial=0;
  if(p.inner===undefined)p.inner=0;
  if(p.wisdom===undefined)p.wisdom=0;
  if(p.fortune===undefined)p.fortune=0;
  if(p.calm===undefined)p.calm=0;
  if(!p.maxHp)p.maxHp=100;
  if(p.hp===undefined)p.hp=p.maxHp;
  if(!p.skills)p.skills=[];
  if(!p.equip)p.equip=emptyEquipSlots();
  var rate={凡品:1,良品:1.5,上品:2,絕品:3,神品:5};
  var r=rate[p.aptitude]||1;
  // 每月微幅成長：血量上限 + 武力／內力（確保戰鬥會變強）
  var hpGain=Math.max(1,Math.floor(r*2+rnd(3)));
  p.maxHp=(p.maxHp||100)+hpGain;
  p.hp=Math.min(p.maxHp,(p.hp||0)+hpGain);
  if(chance(0.6))p.martial=(p.martial||0)+Math.max(1,Math.floor(r));
  if(chance(0.5))p.inner=(p.inner||0)+Math.max(1,Math.floor(r*0.8));
  p.growth=(p.growth||0)+r;
  if(p.growth>=10){
    p.growth=0;
    var amount=Math.max(2,Math.floor(r*2+1));
    var roll=Math.random();
    if(roll<0.45){
      // 主屬性大成長（偏戰鬥）
      var at=chance(0.7)?pick(['martial','inner']):pick(['martial','inner','wisdom','fortune','calm']);
      p[at]=(p[at]||0)+amount;
      // 同步血量
      var extraHp=amount*4;
      p.maxHp+=extraHp;p.hp=Math.min(p.maxHp,p.hp+extraHp);
      S.log.push('【伴侶成長】'+p.name+' '+getAttrName(at)+' +'+amount+'　氣血上限 +'+extraHp);
    }else if(roll<0.75&&p.skills.length<12){
      var sk=genSkill(p.aptitude);
      p.skills.push(sk);
      S.log.push('【伴侶成長】'+p.name+' 學會了 '+sk.name+'（'+(sk.tier||p.aptitude)+'）');
    }else{
      var slot=pick(['主手','身體','頭部','鞋子','項鍊']);
      var eq=genEquip(slot,p.aptitude);
      if(partnerAutoEquip(eq))S.log.push('【伴侶成長】'+p.name+' 裝備了 '+eq.name);
      else S.log.push('【伴侶成長】'+p.name+' 獲得裝備 '+eq.name+'（未更優，未替換）');
    }
  }
  var aux=p.auxTalent;
  if(aux){
    if(aux.id==='heal_month')S.hp=Math.min(getTotalMaxHp(),S.hp+15);
    if(aux.id==='stress_down')S.stress=Math.max(0,S.stress-8);
    if(aux.id==='share_martial')S.martial+=1;
    if(aux.id==='share_inner')S.inner+=1;
    if(aux.id==='share_wisdom')S.wisdom+=1;
    if(aux.id==='share_fortune')S.fortune+=1;
    if(aux.id==='money_find')S.money+=10+rnd(20);
  }
  if(p.destinyTalent&&p.destinyTalent.id==='ptd_fortune'){S.money+=30+rnd(40);S.fortune+=1;}
}
function partnerAutoEquip(item){
  if(!S.partner||S.partnerDead||!item||!item.slot)return false;
  if(!S.partner.equip)S.partner.equip=emptyEquipSlots();
  var old=S.partner.equip[item.slot];
  if(!old||TIERS[item.tier].mult>TIERS[old.tier].mult||(item.tier===old.tier&&item.main.val>old.main.val)){S.partner.equip[item.slot]=item;return true;}
  return false;
}
function confidanteMonthlyGrowth(){if(!S.confidantes)return;S.confidantes.forEach(function(c){if(c.love<100)c.love=Math.min(100,(c.love||0)+1+rnd(2));});}
function nextMonth(skipSpecial){
  if(!S||S.gameOver)return;
  saveGame();
  if(!skipSpecial&&checkSpecialEvents())return;
  S.month++;S.totalMonths++;
  if(S.month>=12){S.month=0;S.age++;}
  if(S.regen>0)S.hp=Math.min(getTotalMaxHp(),S.hp+S.regen);
  if(S.hp<=0){
    if(S.age<18){
      S.hp=Math.max(1,Math.floor(getTotalMaxHp()*0.1));
      S.stress=Math.min(100,(S.stress||0)+20);
      S.log.push('【重傷】你傷勢過重，卻奇蹟般撐了過來。');
      toast('重傷倖存，未至隕落',2500);
      clampMoney();
    }else{
      endGame('傷重不治');return;
    }
  }
  if(S.age>=(S.maxAge||100)){endGame('壽終正寢');return;}
  S.stress+=1;if(S.calm>30)S.stress-=1;
  if(S.stress>=100){S.hp-=20;S.stress=50;}
  S.hp=Math.min(getTotalMaxHp(),S.hp+2);
  var gr={凡品:1,良品:1.5,上品:2,絕品:3,神品:5};
  S.pets.forEach(function(p){
    if(p.bond<100)p.bond+=1;
    var tree=PET_TREE[p.species];if(!tree||!tree.stages[p.stage])return;
    var cur=tree.stages[p.stage];
    var mHp=p.maxHp||cur.hp*3;
    if(p.hp===undefined||p.hp===null)p.hp=mHp;
    if(p.hp<mHp)p.hp=Math.min(mHp,p.hp+Math.ceil(mHp*0.1));
    if(p.bond>=50&&chance(0.15)){var d=pick(EVO_ITEMS);p.evoItems[d]=(p.evoItems[d]||0)+1;}
    if(p.bonusAtk===undefined)p.bonusAtk=0;
    var rate=gr[p.aptitude]||1;
    p.growth=(p.growth||0)+rate;
    if(p.growth>=12){p.growth=0;p.maxHp+=Math.floor(8*rate);p.bonusAtk+=Math.floor(rate);p.hp=Math.min(p.hp+15,p.maxHp);S.log.push('【寵物成長】'+p.n+' 攻+'+Math.floor(rate)+'，HP+'+Math.floor(8*rate));}
  });
  if(S.partner&&!S.partnerDead&&S.partner.stage!=='夫妻'&&S.partner.stage!=='亡故'){
    var lg=1;
    if(S.calm>30)lg+=1;if(S.stress<50)lg+=1;if(S.money>100)lg+=1;
    if(S.partner.personality==='溫柔'||S.partner.personality==='端莊'||S.partner.personality==='天真')lg+=1;
    if(S.partner.personality==='風流'||S.partner.personality==='孤傲'||S.partner.personality==='冷淡')lg-=1;
    lg+=rnd(3);if(lg<0)lg=0;
    S.partner.love=Math.min(100,S.partner.love+lg);
  }
  if(S.partner&&!S.partnerDead){partnerMonthlyGrowth();checkPartnerDeath();}
  confidanteMonthlyGrowth();
  childMonthlyGrowth();
  checkBountyCompletion();
  if(S.totalMonths-BOUNTY_REFRESH>=3||BOUNTY_LIST.length===0){refreshBounties();BOUNTY_REFRESH=S.totalMonths;}
  if(S.totalMonths-AUCTION_REFRESH>=6||AUCTION_LIST.length===0){refreshAuctions();AUCTION_REFRESH=S.totalMonths;}
  if(S.exiledFrom&&!S.gameOver){checkMasterHunt();if(BATTLE){render();return;}}
  checkMasterPromotion();
  if(checkMasterTask()){render();renderEvent();return;}
  if(tryMasterEncounter()){TAB='main';if(S.destinyEncounterPending)renderDestinyEncounter();else renderMasterEncounter();render();return;}if(typeof tryDestinyFollowUp==='function'&&tryDestinyFollowUp()){TAB='main';renderDestinyFollowUp();render();return;}
  checkAchievements();
  try{runAutoMonthlyTasks();ensureConfidanteSlotForAuto();}catch(_m){}
  var ev=pickEvent();S.currentEvent=ev;S.pendingResult=null;S._isSpecialEvent=false;
  TAB='main';renderEvent();render();
}
function checkSpecialEvents(){
  if(S.partner&&!S.partnerDead&&S.partner.stage!=='夫妻'&&S.partner.stage!=='亡故'&&chance(0.25)){
    S.currentEvent=convertEvent(pick(PARTNER_EVENTS));
    S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */
    TAB='main';renderEvent();render();
    return true;
  }
  var spList=SCENE_EVENTS['special']||[];
  var spPool=spList.filter(function(e){
    if(e.once&&hasSeen(e.id))return false;
    if(e.age&&(S.age<e.age[0]||S.age>e.age[1]))return false;
    if(e.cond){try{if(!e.cond(S))return false;}catch(err){return false;}}
    return true;
  });
  var must=spPool.filter(function(e){return e.id==='lc'||e.id==='lch';});
  if(must.length>0){
    var chosen=pick(must);
    if(chosen.once)S.seen.push(chosen.id);
    S.currentEvent=convertEvent(chosen);
    S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */
    TAB='main';renderEvent();render();
    return true;
  }
  if(!S.partner&&spPool.some(function(e){return e.id==='ml';})){
    if(chance(0.15)){S.currentEvent=convertEvent(spPool.filter(function(e){return e.id==='ml';})[0]);S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */TAB='main';renderEvent();render();return true;}
  }
  if(S.pets.length<5&&spPool.some(function(e){return e.id==='pf';})){
    if(chance(0.15)){S.currentEvent=convertEvent(spPool.filter(function(e){return e.id==='pf';})[0]);S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */TAB='main';renderEvent();render();return true;}
  }
  if(!S.master&&!S.sect&&S.age>=14&&S.age<=30&&spPool.some(function(e){return e.id==='sr';})){
    if(chance(0.05)){S.currentEvent=convertEvent(spPool.filter(function(e){return e.id==='sr';})[0]);S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */TAB='main';renderEvent();render();return true;}
  }
  if(!S.sect&&S.age>=18&&S.demonic>=15&&spPool.some(function(e){return e.id==='dm';})){
    if(chance(0.08)){S.currentEvent=convertEvent(spPool.filter(function(e){return e.id==='dm';})[0]);S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */TAB='main';renderEvent();render();return true;}
  }
  var fList=(SCENE_EVENTS['fate']||[]).filter(function(e){
    if(e.once&&hasSeen(e.id))return false;
    if(e.age&&(S.age<e.age[0]||S.age>e.age[1]))return false;
    if(e.cond){try{if(!e.cond(S))return false;}catch(err){return false;}}
    return true;
  });
  if(fList.length&&chance(0.15)){
    var ch=pick(fList);
    if(ch.once)S.seen.push(ch.id);
    S.currentEvent=convertEvent(ch);
    S.pendingResult=null;S._isSpecialEvent=true;/* 自動歷練可處理特殊事件 */
    TAB='main';renderEvent();render();
    return true;
  }
  return false;
}
function getTotalMaxHp(){
  var b=0;
  for(var k in S.equip){var e=S.equip[k];if(e){if(e.main.key==='maxHp')b+=e.main.val;e.subs.forEach(function(s){if(s.key==='maxHp')b+=s.val;});}}
  S.skills.forEach(function(sk){if(sk.main.key==='maxHp')b+=sk.main.val;sk.subs.forEach(function(s){if(s.key==='maxHp')b+=s.val;});});
  if(S.partner&&!S.partnerDead&&S.partner.traitKey==='maxHp')b+=S.partner.traitVal;
  S.pets.forEach(function(p){
    var _tree=PET_TREE[p.species];
    if(!_tree||!_tree.stages[p.stage])return;
    var cur=_tree.stages[p.stage];
    var pMax=Math.floor(cur.hp*3*getAptMult(p.aptitude||'凡品'));
    b+=Math.floor(pMax/4);
  });
  var cb=getConfidanteBonus();b+=cb.maxHp;
  b+=getSetBonus().maxHp;
  return S.maxHp+b;
}
function getPetAtk(){
  var v=0;
  S.pets.forEach(function(p){
    var _tree=PET_TREE[p.species];
    if(!_tree||!_tree.stages[p.stage])return;
    var cur=_tree.stages[p.stage];
    v+=Math.floor((cur.atk+(p.bonusAtk||0))*getAptMult(p.aptitude));
  });
  return v;
}
function totalAtk(){
  var v=S.martial*2+S.inner+S.fortune/2+getPetAtk();
  for(var k in S.equip){var e=S.equip[k];if(e){if(e.main.key!=='maxHp')v+=e.main.val;e.subs.forEach(function(s){if(s.key==='martial')v+=s.val;});}}
  S.skills.forEach(function(sk){if(sk.main.key!=='maxHp')v+=sk.main.val;sk.subs.forEach(function(s){if(s.key==='martial')v+=s.val;});});
  if(S.partner&&!S.partnerDead){if(S.partner.traitKey==='martial')v+=S.partner.traitVal;if(S.partner.stage==='夫妻')v+=Math.floor(S.partner.love/3);}
  var cb=getConfidanteBonus();v+=cb.martial*2;
  v+=getSetBonus().martial*2;
  return v;
}

function checkBountyCompletion(){
  if(!S.bountyActive||S.bountyActive.length===0)return;
  var done=[];
  S.bountyActive.forEach(function(ab,i){
    ab.monthLeft--;
    if(ab.monthLeft<=0){
      var pow=S.martial+S.inner+S.fortune/2+getPetAtk();
      var roll=pow+rnd(30),b=ab.bounty;
      if(roll>=b.diff){
        S.money+=moneyGain(b.rewardMoney);S.fame+=b.rewardFame;
        if(b.rewardDemonic){S.demonic+=b.rewardDemonic;S.righteous=Math.max(0,S.righteous-2);}
        else{S.righteous+=3;S.demonic=Math.max(0,S.demonic-1);}
        if(b.tier==='神品'&&!S.hasAuctionTicket){
          S.auctionFragments=(S.auctionFragments||0)+10;
          S.log.push('【拍賣碎片】神品懸賞額外贈與 10 片（'+S.auctionFragments+'/100）');
          if(S.auctionFragments>=AUCTION_TICKET_FRAGMENTS_NEEDED){
            S.auctionFragments=0;S.hasAuctionTicket=true;
            S.log.push('✦✦✦ 集齊碎片，合成【拍賣行入場券】！ ✦✦✦');
            toast('✦ 獲得拍賣行入場券！ ✦',6000);
          }
        }
        S.log.push('懸賞完成：'+b.name+'！');done.push(i);
      }else{S.hp-=15+rnd(20);S.log.push('懸賞失敗：'+b.name+'……');done.push(i);}
    }
  });
  for(var j=done.length-1;j>=0;j--){S.bountyActive.splice(done[j],1);}
}

function placeBid(i){
  var a=AUCTION_LIST[i];if(!a||a.sold)return;
  var input=document.getElementById('bid_'+i);
  var bid=parseInt(input?input.value:0)||0;
  if(bid<=a.currentBid){toast('出價必須高於 '+a.currentBid);return;}
  var available=S.money+(a.playerBid||0);
  if(bid>available){toast('銀兩不足（可用 '+available+'）');return;}
  if(a.playerBid){S.money+=a.playerBid;a.playerBid=0;}
  a.playerBid=bid;a.currentBid=bid;a.bidder='player';S.money-=bid;
  var rc=hasTalent('財神眷顧')?0.15:0.35;
  if(chance(rc)){var co=bid+20+rnd(50);a.currentBid=co;a.bidder='npc';S.money+=bid;a.playerBid=0;toast('有人加價至 '+co+' 兩');}
  else toast('目前你是最高出價者');
  renderAuction(document.getElementById('event'));saveGame();
}
function confirmAuctionWin(i){
  var a=AUCTION_LIST[i];if(!a||a.bidder!=='player'||a.sold)return;
  a.sold=true;a.playerBid=0;
  if(a.itemType==='equip'){addToBagEquip(a.item);}
  else if(a.itemType==='skill'){if(S.skills.length<30)S.skills.push(a.item);else{S.money+=a.currentBid;}}
  else{
    if(a.name==='攻擊強化符')S.martial+=5;
    else if(a.name==='防禦強化符')S.inner+=5;
    else if(a.name==='四維強化石'){S.martial+=3;S.inner+=3;S.wisdom+=3;S.fortune+=3;}
    else if(a.name==='千年靈芝'){S.maxHp+=50;S.hp+=50;}
    else if(a.name==='龍涎香')S.calm+=20;
    else if(a.name==='誘惑之花'){S.righteous=Math.max(0,S.righteous-15);S.demonic+=5;}
    else if(a.name==='洗髓經'){var r=S.skills.filter(function(sk){return !sk.fromMaster;});if(r.length===0)toast('沒有可洗去的功法');else{r.sort(function(x,y){return TIERS[x.tier].mult-TIERS[y.tier].mult;});var re=r[0];S.skills.splice(S.skills.indexOf(re),1);S.log.push('【洗髓】洗去了功法：'+re.name);toast('洗去：'+re.name,3000);}}
    else if(a.name==='天外隕鐵')S.bagItem.push({id:'it'+Date.now()+rnd(9999),type:'item',tier:'神品',name:'天外隕鐵',main:{name:'神秘材料',key:'mat',val:1},subs:[]});
    else if(a.name===AUCTION_TICKET_NAME)S.hasAuctionTicket=true;
  }
  S.log.push('成功得標「'+a.name+'」！');
  checkAchievements();
  renderAuction(document.getElementById('event'));render();saveGame();
}

function startRiddle(){

  renderRiddle();
}
function renderRiddle(){
  var el=document.getElementById('event');
  if(!RIDDLE_CURRENT){el.innerHTML='<h2>🧩 猜謎</h2><button class="main" onclick="switchTab(\'main\')">返回</button>';return;}
  var r=RIDDLE_CURRENT,cc=S.riddleCorrect||0;
  var lvT,lvC;
  if(cc>=80){lvT='神品獎勵';lvC='#fbbf24';}
  else if(cc>=50){lvT='絕品獎勵';lvC='#c084fc';}
  else if(cc>=30){lvT='上品獎勵';lvC='#60a5fa';}
  else if(cc>=15){lvT='良品獎勵';lvC='#4ade80';}
  else{lvT='凡品獎勵';lvC='#9ca3af';}
  var h='<h2>🧩 猜謎大會</h2>';
  h+='<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>已答對：<b style="color:#fbbf24">'+cc+'</b> 題</span><span>獎勵：<b style="color:'+lvC+'">'+lvT+'</b></span></div>';
  if(hasTalent('智慧通天'))h+='<div style="color:#fbbf24;font-size:11px;text-align:center;margin-bottom:6px;padding:4px;background:#f5efe6;border:1px solid #e6b85c;border-radius:4px">✦ 智慧通天：選項減半 ✦</div>';
  h+='<div class="riddleCard"><div class="rq">'+r.q+'</div>';
  if(RIDDLE_ANSWERED){
    var lr=RIDDLE_LAST_RESULT||{};
    if(lr.correct){
      h+='<div style="color:#4ade80;font-size:14px;font-weight:bold;margin-bottom:8px">✓ 答對！</div>';
      if(lr.reward)h+='<div style="color:'+(lr.tier||'#fbbf24')+';font-size:13px;padding:10px;background:#f5efe6;border:1px solid '+(lr.tier||'#fbbf24')+';border-radius:6px;margin-bottom:10px;line-height:1.6">🎁 '+lr.reward+'</div>';
    }else{
      h+='<div style="color:#ef4444;font-size:14px;font-weight:bold;margin-bottom:8px">✗ 答錯</div>';
      h+='<div style="color:var(--muted);font-size:13px;padding:8px;background:#f5efe6;border-radius:6px;margin-bottom:10px">正確答案：<b style="color:var(--gold)">'+r.a+'</b></div>';
    }
    h+='<button class="main" onclick="nextRiddle()">下一題 ▶</button>';
  }else{
    var opts;
    if(hasTalent('智慧通天')){
      var wo=r.opts.filter(function(o){return o!==r.a;});
      var pw=pick(wo);
      var tw=[r.a];if(pw!==r.a)tw.push(pw);
      opts=shuffle(tw);
    }else{
      var seen={},uq=[];
      r.opts.forEach(function(o){if(!seen[o]){seen[o]=1;uq.push(o);}});
      opts=shuffle(uq);
    }
    opts.forEach(function(o){h+='<button class="riddleOpt" onclick="answerRiddle(\''+o+'\')">'+o+'</button>';});
  }
  h+='</div><button class="main" onclick="switchTab(\'main\')">返回主線</button>';
  el.innerHTML=h;
}
function answerRiddle(ans){
  var r=RIDDLE_CURRENT;if(!r||RIDDLE_ANSWERED)return;
  RIDDLE_ANSWERED=true;
  var correct=(ans===r.a);
  var rMsg='',rT='#9ca3af';
  initAchievements();
  if(correct){
    S.riddleCorrect=(S.riddleCorrect||0)+1;
    S.achieveStats.riddleStreak=(S.achieveStats.riddleStreak||0)+1;
    if(S.achieveStats.riddleStreak>(S.achieveStats.maxRiddleStreak||0))S.achieveStats.maxRiddleStreak=S.achieveStats.riddleStreak;
    if(S.achieveStats.riddleStreak>=10)unlockAchievement('riddle_streak_10');
    var rw=grantRiddleReward(S.riddleCorrect);
    rMsg=rw.result;rT=TIERS[rw.tier].c;
    S.log.push('猜謎答對：'+rw.result);
  }else{S.achieveStats.riddleStreak=0;S.log.push('猜謎答錯，答案是「'+r.a+'」。');}
  if(S.riddleHistory.indexOf(r.q)<0)S.riddleHistory.push(r.q);
  RIDDLE_LAST_RESULT={correct:correct,answer:r.a,reward:rMsg,tier:rT};
  renderRiddle();render();saveGame();
}
function nextRiddle(){RIDDLE_CURRENT=null;RIDDLE_ANSWERED=false;RIDDLE_LAST_RESULT=null;startRiddle();}
function grantRiddleReward(count){
  var mx;if(count>=80)mx=4;else if(count>=50)mx=3;else if(count>=30)mx=2;else if(count>=15)mx=1;else mx=0;
  var roll=Math.random(),ti;
  if(roll<0.5)ti=mx;else if(roll<0.8&&mx>=1)ti=mx-1;else ti=Math.max(0,mx-2);
  var tier=TIER_ORDER[ti],mult=TIERS[tier].mult,type=rnd(5),result='';
  if(type===0){var amt=moneyGain(Math.floor((30+rnd(60))*mult));S.money+=amt;result='💰 獲得銀兩 <b>'+amt+'</b> 兩';}
  else if(type===1){var at=[{name:'武力',key:'martial'},{name:'內力',key:'inner'},{name:'悟性',key:'wisdom'},{name:'福緣',key:'fortune'},{name:'靜',key:'calm'}];var a=pick(at);var v=Math.max(1,Math.floor((1+rnd(3))*mult));S[a.key]+=v;result='✨ '+a.name+' <b>+'+v+'</b>';}
  else if(type===2){var it=genItem(tier);result='🎁 '+addToBagItem(it);}
  else if(type===3){var sk=genSkill(tier);if(S.skills.length<30){S.skills.push(sk);result='📜 習得功法「<b>'+sk.name+'</b>」';}else{S.money+=TIERS[tier].val*2;result='📜 功法已滿，折為 <b>'+(TIERS[tier].val*2)+'</b> 兩';}}
  else{var slot=pick(Object.keys(SLOT_DEF));var eq=genEquip(slot,tier);var rr=addToBagEquip(eq);result=rr.sold?('⚔️ '+rr.msg):('⚔️ 獲得裝備「<b>'+eq.name+'</b>」');}
  return {result:result,tier:tier};
}

function guessOptTag(opt){
  var tx=(opt&&(opt.text||opt.t||opt.label||''))||'';
  try{

      return{cls:'tag-evil',lab:'邪道'};
    if((typeof isRighteousOptionText==='function'&&isRighteousOptionText(tx))||/正道|俠義|行俠|仗義|施捨|相助/.test(tx))
      return{cls:'tag-good',lab:'正道'};
    if((typeof isBattleOptionText==='function'&&isBattleOptionText(tx))||/戰鬥|對決|比武|迎戰/.test(tx))
      return{cls:'tag-battle',lab:'戰鬥'};
  }catch(e){}
  var st=opt&&opt.stat;
  if(st==='martial'||/武力|拔劍|動手|挑戰|擊|斬/.test(tx))return{cls:'tag-martial',lab:'武力'};
  if(st==='inner'||/內力|真氣|運功|吐納/.test(tx))return{cls:'tag-inner',lab:'內力'};
  if(st==='wisdom'||/悟性|思索|推測|猜|智/.test(tx))return{cls:'tag-wisdom',lab:'悟性'};
  if(st==='fortune'||/福緣|運氣|碰碰|隨緣|祈/.test(tx))return{cls:'tag-fortune',lab:'福緣'};
  return{cls:'tag-neutral',lab:'中立'};
}

function getRealmInfo(){
  if(!S)return{name:'未入江湖',pct:0,next:'—',hint:''};
  var a=S.age||10, m=S.martial||0, inn=S.inner||0, power=m+inn;
  var realms=[
    {name:'初窺門徑',need:0},{name:'略有小成',need:40},{name:'登堂入室',need:90},
    {name:'融會貫通',need:160},{name:'爐火純青',need:260},{name:'一代宗師',need:400},
    {name:'超凡入聖',need:600},{name:'破碎虛空',need:900}
  ];
  var idx=0;
  for(var i=0;i<realms.length;i++){if(power>=realms[i].need)idx=i;}
  var cur=realms[idx], nxt=realms[Math.min(idx+1,realms.length-1)];
  var span=Math.max(1,(nxt.need||cur.need+1)-cur.need);
  var pct=idx>=realms.length-1?100:Math.min(100,Math.floor((power-cur.need)/span*100));
  return{name:'第'+(idx+1)+'重・'+cur.name,pct:pct,next:idx>=realms.length-1?'已至巔峰':('下一重：'+nxt.name+'（差 '+(nxt.need-power)+'）'),hint:'武力+內力累積推進境界'};
}

function loadTowerUnlocks(){

function getTowerUnlockedList(){
  var u=loadTowerUnlocks(),list=[];
  for(var id in u){if(u[id]){
    var found=null;
    ['melee','ranged','support','guard'].forEach(function(role){
      TOWER_ROLE_TALENTS[role].forEach(function(t){if(t.id===id)found={role:role,t:t};});
    });
    if(found)list.push({id:id,role:found.role,name:found.t.name,desc:found.t.desc,icon:found.t.icon,floor:u[id].floor||0});
  }}
  return list;
}
function unlockTowerTalentByFloor(floor){
  // 每通關 10 層解鎖對應品階隨機一職天賦（終身一次）
  if(floor%10!==0)return null;
  var tierIdx=Math.min(5, Math.floor(((floor-1)%60)/10));
  var roles=['melee','ranged','support','guard'];
  var role=roles[rnd(roles.length)];
  var talent=TOWER_ROLE_TALENTS[role][tierIdx];
  if(!talent)return null;
  var u=loadTowerUnlocks();
  if(u[talent.id])return null; // 不重複
  u[talent.id]={floor:floor,role:role,name:talent.name};
  saveTowerUnlocks(u);
  return talent;
}
function towerFloorInfo(floor){
  var f=Math.max(1,floor|0);
  var phase=Math.min(4, Math.floor((f-1)/60)); // 0..4 → 1..5 人
  var count=phase+1;
  var local=(f-1)%60;
  var tierIdx=Math.floor(local/10);
  var tier=TOWER_TIERS[tierIdx];
  var mul=TOWER_TIER_MUL[tier] * Math.pow(10, Math.max(0, Math.floor((f-1)/300))); // 301+ 輪迴
  return {floor:f,phase:phase,count:count,tier:tier,tierIdx:tierIdx,enemyMul:mul,color:TOWER_TIER_COLOR[tier]};
}
function ensureTowerState(){
  if(!S.tower)S.tower={active:false,floor:1,runMul:1,bestFloor:0,milestones:{},lifespanGained:0};
  if(S.tower.runMul<1)S.tower.runMul=1;
}
function getTowerRunMul(){
  ensureTowerState();
  return S.tower.active? (S.tower.runMul||1) : 1;
}
function genTowerEnemy(floor, slot){
  var info=towerFloorInfo(floor);
  var roles=['melee','ranged','support','guard'];
  var role=roles[(slot+floor)%4];
  var names=TOWER_NAMES[role];
  var name=pick(names)+'·'+info.tier;
  var talent=TOWER_ROLE_TALENTS[role][info.tierIdx];
  // 以玩家戰力為基，再乘塔倍率（凡品≈可對神話師父）
  var base=calcEnemyStrength(0,'tower');
  var m=info.enemyMul * 0.85;
  return {
    name:name, role:role, tier:info.tier, color:info.color,
    talent:talent,
    hp:Math.max(30, Math.floor(base.hp*m)),
    atk:Math.max(5, Math.floor(base.atk*m)),
    def:Math.max(2, Math.floor(base.def*m*0.8))
  };
}

function submitTowerScore(floor, name){
  ensureTowerState();
  floor=Math.max(0, floor|0);
  if(floor<=0)return;
  name=(name||(S&&S.playerName)||'無名俠客').toString().slice(0,12);
  var list=loadTowerLeaderboard();
  var id=(S&&S.playerName?S.playerName:'')+'_'+Date.now();
  // 同一俠名只保留最高層
  var found=-1;
  for(var i=0;i<list.length;i++){
    if(list[i].name===name&&!list[i].imported){found=i;break;}
  }
  var entry={name:name,floor:floor,mul:(S.tower&&S.tower.runMul)||1,date:Date.now(),imported:false};
  if(found>=0){
    if(floor>list[found].floor)list[found]=entry;
  }else list.push(entry);
  list.sort(function(a,b){return b.floor-a.floor;});
  if(list.length>30)list=list.slice(0,30);
  saveTowerLeaderboard(list);
}
function importTowerScoreCode(code){
  try{
    code=(code||'').trim();
    if(!code){toast('請貼上戰績碼');return false;}
    // 格式 STLB|name|floor|checksum
    if(code.indexOf('STLB|')!==0){
      // try base64
      try{code=decodeURIComponent(escape(atob(code)));}catch(e){}
    }
    var p=code.split('|');
    if(p[0]!=='STLB'||p.length<4){toast('戰績碼無效');return false;}
    var name=p[1].slice(0,12);
    var floor=parseInt(p[2],10)||0;
    var chk=p[3];
    var expect=String((name.length*7+floor*13)%9973);
    if(chk!==expect){toast('戰績碼校驗失敗');return false;}
    if(floor<=0){toast('層數無效');return false;}
    var list=loadTowerLeaderboard();
    list.push({name:name+'（他）',floor:floor,mul:1,date:Date.now(),imported:true});
    list.sort(function(a,b){return b.floor-a.floor;});
    if(list.length>30)list=list.slice(0,30);
    saveTowerLeaderboard(list);

function towerChallengeFloor(){
  ensureTowerState();
  if(!S.tower.active){startTowerRun();}
  var floor=S.tower.floor;
  var info=towerFloorInfo(floor);
  // 多人：連續打 count 場，或一場多血？簡化為一場，敵人为强化单体代表（血量×人数系数）
  var en=genTowerEnemy(floor,0);
  en.hp=Math.floor(en.hp*info.count);
  en.atk=Math.floor(en.atk*(1+(info.count-1)*0.35));
  en.name=en.name+(info.count>1?('（'+info.count+'灵）'):'');
  // 玩家塔内倍率体现在 startBattle 后修正
  startBattle(en.name, en.hp, en.atk, en.def, 'tower');
  if(BATTLE){
    BATTLE.isTower=true;
    BATTLE.towerFloor=floor;
    BATTLE.towerTalent=en.talent;
    BATTLE.towerRole=en.role;
    // 应用玩家 runMul 到玩家侧
    var rm=S.tower.runMul||1;
    if(rm>1){
      BATTLE.player.atk=Math.floor(BATTLE.player.atk*rm);
      BATTLE.player.maxHp=Math.floor(BATTLE.player.maxHp*rm);
      BATTLE.player.hp=Math.min(BATTLE.player.maxHp, Math.floor(BATTLE.player.hp*rm));
      if(BATTLE.partner){
        BATTLE.partner.atk=Math.floor(BATTLE.partner.atk*rm);
        BATTLE.partner.maxHp=Math.floor(BATTLE.partner.maxHp*rm);
        BATTLE.partner.hp=Math.min(BATTLE.partner.maxHp, Math.floor(BATTLE.partner.hp*rm));
      }
      (BATTLE.pets||[]).forEach(function(p){
        p.atk=Math.floor(p.atk*rm);
        p.maxHp=Math.floor(p.maxHp*rm);
        p.hp=Math.min(p.maxHp, Math.floor(p.hp*rm));
      });
    }
    renderBattle();
  }
}
function onTowerBattleWin(){
  ensureTowerState();
  var floor=S.tower.floor||1;
  if(floor>(S.tower.bestFloor||0))S.tower.bestFloor=floor;
  // 每 10 层里程碑
  if(floor%10===0){
    if(!S.tower.milestones)S.tower.milestones={};
    var key='f'+floor;
    // 寿命每次通关该层都给？用户：奖励不重复，寿命除外 → 寿命可重复获得
    S.maxAge=(S.maxAge||100)+10;
    S.tower.lifespanGained=(S.tower.lifespanGained||0)+10;
    S.tower.runMul=(S.tower.runMul||1)*2;
    S.log.push('【時空之塔】通過第 '+floor+' 層！壽命+10，塔內實力×2（現 ×'+S.tower.runMul+'）');
    toast('🕰 第'+floor+'層！壽命+10，實力×2',3500);
    var talent=unlockTowerTalentByFloor(floor);
    if(talent){
      S.log.push('【時空之塔】解鎖來生可選天賦：'+talent.icon+' '+talent.name);
      toast('✦ 解鎖塔天賦：'+talent.name,3000);
    }else{
      // 已有则提示
      if(!S.tower.milestones[key])S.log.push('【時空之塔】此層天賦此前已解鎖，不再重複發放');
    }
    S.tower.milestones[key]=true;
  }else{
    S.log.push('【時空之塔】通過第 '+floor+' 層');
  }
  S.tower.floor=floor+1;
  if(typeof submitTowerScore==='function')submitTowerScore(S.tower.bestFloor||floor, S.playerName);
  // 回一点血
  S.hp=Math.min(getTotalMaxHp(), Math.max(S.hp, Math.floor(getTotalMaxHp()*0.5)));
  saveGame();
}

function clearAutoPlay(){

}
function autoDelay(){return S&&S.autoPlay?280:900;}
function scheduleAutoPlay(){
  clearAutoPlay();

  if(!canEnableAutoPlay()){S.autoPlay=false;toast('條件不足，自動已關閉');return;}

function isBattleOptionText(t){
  return /一戰|迎戰|接受挑戰|出手制止|出手相助|挺身而出|主動追捕|拔劍迎戰|與他們一戰|參加大會|一劍斬殺|決鬥|動手|硬拚|開戰/.test(t||'');
}
function isRighteousOptionText(t){
  return /施捨|扶|救|勸|報官|掩埋|放她自由|相助|制止|正道|俠|清掃|參拜|請教|幫他|帶他|給他|幫忙|行俠/.test(t||'');
}
function isEvilOptionText(t){
  return /搶|偷|威脅|踢|騙|訛詐|搜刮|灌醉|下毒|補刀|黑吃|砸毀|強買|聯手|假意|恐嚇|滅口|辱罵|霸佔|白拿|白吃|不給錢|加入惡|加入大盜|墮入/.test(t||'');
}
function isSpendMoneyOptionText(t){
  return /打賞|給.*兩|花.*銀|付|買|買下|資助|施捨|捐|賞|破費|掏銀|付錢|銀兩換|買下|請他|請她|請一|請這/.test(t||'');
}
function scoreAutoOption(opt){
  var t=opt.t||opt.text||'';
  var score=10;
  ensureAutoSettings();
  var align=S.autoPreferAlign||'none';
  var wantBattle=!!S.autoPreferBattle;
  var wantSpend=S.autoPreferSpend!==false;
  var isB=isBattleOptionText(t);
  var isR=isRighteousOptionText(t);
  var isE=isEvilOptionText(t);
  var isPay=isSpendMoneyOptionText(t);
  var isLeave=/婉拒|離開|不感興趣|視而不見|默默|繼續趕路|過而不問|只是看看|拱手|告辭/.test(t);
  if(wantSpend&&isPay)score+=120;
  if(align==='righteous'){if(isR)score+=70;if(isE)score-=50;if(!isR&&!isE&&isLeave)score+=15;}
  else if(align==='demonic'){if(isE)score+=70;if(isR)score-=50;}
  else if(align==='neutral'){if(!isR&&!isE)score+=40;if(isE||isR)score-=20;}
  if(wantBattle){if(isB)score+=50;}else{if(isB)score-=15;}
  if(isB&&(S._autoBattleStreak||0)>=2)score-=80;
  if(/救牠|救它|抱起/.test(t))score+=S.autoPetSave!==false?80:-40;
  if(/上前攀談|鼓起勇氣/.test(t))score+=S.autoPartnerMeet!==false?70:-40;
  if(/點頭離開|擦肩/.test(t))score+=S.autoPartnerMeet!==false?-20:40;
  if(S.autoPartnerInteract!==false&&/陪|看星星|散步|談心|送|關心|擁抱/.test(t))score+=55;
  if(isLeave)score-=5;
  score+=Math.random()*3;
  return score;
}

function runAutoMonthlyTasks(){
  if(!S||!S.autoPlay)return;
  ensureAutoSettings();
  try{
    // 1) 寵物進化
    if(S.autoPetEvolve!==false&&S.pets){
      for(var i=0;i<S.pets.length;i++){
        var chk=canEvolve(S.pets[i]);
        if(chk&&chk.ok){
          try{doEvolve(i);S.log.push('【自動】寵物進化：'+(S.pets[i].n||''));}catch(e){}
        }
      }
    }
    // 2) 自動求婚
    if(S.autoPropose!==false&&S.partner&&!S.partnerDead&&S.partner.stage==='相戀'&&(S.partner.love||0)>=80&&S.money>=999){
      S.money-=999;S.partner.stage='夫妻';S.partner.love=Math.max(S.partner.love,80);S.calm=(S.calm||0)+10;
      S.log.push('【自動】向 '+S.partner.name+' 求婚成功，結為夫妻');
      toast('自動求婚成功');
    }
    // 3) 伴侶死亡 → 從紅顏扶正
    if(S.autoPromoteConfidante!==false&&(!S.partner||S.partnerDead)&&S.confidantes&&S.confidantes.length){
      // 選品階最高、愛意最高
      var best=-1,bestSc=-1;
      for(var j=0;j<S.confidantes.length;j++){
        var c=S.confidantes[j];if(!c)continue;
        var sc=tierRank(c.aptitude||'凡品')*100+(c.love||0);
        if(sc>bestSc){bestSc=sc;best=j;}
      }
      if(best>=0){
        var c2=S.confidantes.splice(best,1)[0];
        S.partner={
          name:c2.name,gender:c2.gender||'',personality:c2.personality||'溫柔',
          love:Math.max(50,c2.love||40),stage:'相戀',met:c2.met||S.totalMonths,
          hp:100,maxHp:100,martial:0,inner:0,wisdom:0,fortune:0,calm:0,
          aptitude:c2.aptitude||'凡品',destinyTalent:c2.destinyTalent||null,
          equip:emptyEquipSlots(),skills:[],growth:0,log:[],partnerDead:false
        };
        S.partnerDead=false;
        S.log.push('【自動】扶正紅顏 '+c2.name+' 為伴侶');
        toast('自動扶正：'+c2.name);
      }
    }
    // 4) 背包清理
    if(S.autoBagClean){
      processAutoSellBag();
    }
    // 5) 自動裝備（評分更高才換）
    if(S.autoEquipBest){
      tryAutoEquipFromBag();
    }
    // 6) 拍賣行
    if(S.autoAuction&&S.hasAuctionTicket&&S.money>=(S.autoAuctionMinMoney||5000)){
      tryAutoAuctionBuy();
    }
    // 7) 自動接懸賞（按正邪）
    if(S.autoBounty){
      tryAutoAcceptBounty();
    }
  }catch(e){console.error('runAutoMonthlyTasks',e);}
}
function tryAutoAcceptBounty(){
  if(!BOUNTY_LIST||!BOUNTY_LIST.length)return;
  if(!S.bountyActive)S.bountyActive=[];
  if(S.bountyActive.length>=3)return; // 最多同時 3 個
  var align=S.autoBountyAlign||'match';
  var prefer=null;
  if(align==='match'){
    var v=(S.righteous||0)-(S.demonic||0);
    prefer=v>=10?'正':(v<=-10?'邪':null);
  }else if(align==='正'||align==='邪')prefer=align;
  else if(align==='all')prefer=null;
  for(var i=0;i<BOUNTY_LIST.length;i++){
    var b=BOUNTY_LIST[i];
    if(!b||b.accepted)continue;
    var ba=b.align||(b.type&&b.type.align)||'正';
    if(prefer&&prefer!=='all'&&ba!==prefer)continue;
    try{acceptBounty(i);S.log.push('【自動】接下懸賞：'+(b.name||b.type||''));return;}catch(e){}
  }
}

function tryAutoEquipFromBag(){
  if(!S.bagEquip||!S.bagEquip.length)return;
  if(!S.equip)S.equip=emptyEquipSlots();
  var rest=[];
  S.bagEquip.forEach(function(eq){
    if(!eq||!eq.slot){rest.push(eq);return;}
    // 師門武器不自動換掉
    var cur=S.equip[eq.slot];
    if(cur&&cur.isMasterWeapon){rest.push(eq);return;}
    var ns=scoreEquipItem(eq),cs=cur?scoreEquipItem(cur):0;
    if(ns>cs){
      if(cur)rest.push(cur);
      S.equip[eq.slot]=eq;
      S.log.push('【自動裝備】'+eq.name+'（評分'+ns+' > '+(cs||0)+'）');
    }else rest.push(eq);
  });
  S.bagEquip=rest;
}
function tryAutoAuctionBuy(){
  if(typeof AUCTION_LIST==='undefined'||!AUCTION_LIST||!AUCTION_LIST.length)return;
  var wantSet=S.autoAuctionSet||'any';
  // 買最需要的：優先指定套裝神品，其次評分最高且買得起
  var candidates=AUCTION_LIST.filter(function(it){
    if(!it||it.sold)return false;
    var price=it.price||it.cost||0;
    if(S.money<price)return false;
    if(wantSet&&wantSet!=='any'&&it.equip&&it.equip.setId&&it.equip.setId!==wantSet)return false;
    return true;
  });
  if(!candidates.length)return;
  candidates.sort(function(a,b){
    var sa=scoreEquipItem(a.equip||a)||0,sb=scoreEquipItem(b.equip||b)||0;
    return sb-sa;
  });
  var buy=candidates[0];
  var price=buy.price||buy.cost||0;
  if(S.money<price)return;
  S.money-=price;
  var item=buy.equip||buy.item||buy;
  if(item&&item.slot){
    // 進背包再走自動裝備
    if(!S.bagEquip)S.bagEquip=[];
    S.bagEquip.push(item);
    S.log.push('【自動拍賣】拍下 '+((item.name)||'物品')+'（-'+price+'兩）');
    buy.sold=true;
    if(S.autoEquipBest)tryAutoEquipFromBag();
  }
}

function runAutoPlayStep(){
  if(!S||!S.autoPlay||S.gameOver)return;
  if(!canEnableAutoPlay()){S.autoPlay=false;clearAutoPlay();return;}
  ensureAutoSettings();
  if(typeof BATTLE!=='undefined'&&BATTLE&&!BATTLE.done){
    if(!BATTLE.auto){BATTLE.auto=true;try{battleTurn();}catch(e){}}
    scheduleAutoPlay();return;
  }
  if(S.masterEncounterPending){
    if(S.autoAcceptMaster){try{acceptMaster();}catch(e){}}
    else{try{declineMaster();}catch(e){}}
    scheduleAutoPlay();return;
  }
  if(S.destinyEncounterPending){
    if(S.autoDestinyBond!==false){try{acceptDestinyBond();}catch(e){}}
    else{try{declineDestinyBond();}catch(e){}}
    scheduleAutoPlay();return;
  }
  if(S.destinyFollowPending){
    try{resolveDestinyFollowUp(1);}catch(e){}
    scheduleAutoPlay();return;
  }
  if(S.pendingResult){
    try{afterChoice();}catch(e){}
    scheduleAutoPlay();return;
  }
  var ev=S.currentEvent;
  if(ev&&(ev.options||ev.opts)&&(TAB==='main'||S._isSpecialEvent)){
    var opts=ev.options||ev.opts;
    if(opts.length){
      var best=0,bestScore=-1e9;
      for(var i=0;i<opts.length;i++){
        var sc=scoreAutoOption(opts[i]);
        if(sc>bestScore){bestScore=sc;best=i;}
      }
      var picked=opts[best];
      var pt=(picked&&(picked.t||picked.text))||'';
      if(isBattleOptionText(pt))S._autoBattleStreak=(S._autoBattleStreak||0)+1;
      else S._autoBattleStreak=0;
      try{choose(best);}catch(e){S.autoPlay=false;clearAutoPlay();return;}
      scheduleAutoPlay();return;
    }
  }
  if(TAB==='main'&&!S.pendingResult&&!BATTLE){
    try{nextMonth();}catch(e){}
    scheduleAutoPlay();
  }
}
function tryAutoStartBattle(){
  // 追殺／自動模式：開戰即自動
  if(typeof BATTLE==='undefined'||!BATTLE||BATTLE.done)return;
  var force=BATTLE.isHunt||(S&&S.autoPlay);
  if(force&&!BATTLE.auto){
    BATTLE.auto=true;
    setTimeout(function(){try{if(BATTLE&&!BATTLE.done)battleTurn();}catch(e){}},autoDelay());
  }
}

function applyAutoCompanionFilters(){
  if(!S)return;
  ensureAutoSettings();
  // 僅在自動歷練時套用品階規則
  if(!S.autoPlay)return;
  // 伴侶品階不足 → 紅顏（非夫妻）
  if(S.partner&&!S.partnerDead&&S.partner.stage!=='夫妻'){
    var need=S.autoPartnerMinTier||'凡品';
    if(tierRank(S.partner.aptitude||'凡品')<tierRank(need)){
      if(!S.confidantes)S.confidantes=[];
      var p=S.partner;
      if(S.confidantes.length<10){
        S.confidantes.push({
          name:p.name,gender:p.gender||'',personality:p.personality||'',
          love:p.love||20,aptitude:p.aptitude||'凡品',met:p.met||S.totalMonths,
          destinyTalent:p.destinyTalent||null
        });
        S.log.push('【自動】'+p.name+'（'+p.aptitude+'）未達「'+need+'」，轉入紅顏');
      }else{
        S.log.push('【自動】'+p.name+' 品階不足且紅顏已滿，緣分散去');
      }
      S.partner=null;S.partnerDead=false;
    }
  }
  // 剛收養寵物
  if(S.pets&&S.pets.length){
    var needP=S.autoPetMinTier||'凡品';
    var last=S.pets[S.pets.length-1];
    if(last&&last._justAdopted){
      last._justAdopted=false;
      if(tierRank(last.aptitude||'凡品')<tierRank(needP)){
        S.log.push('【自動】'+(last.n||'寵物')+'（'+last.aptitude+'）未達「'+needP+'」，未予收養');
        S.pets.pop();
      }
    }
  }
}
function ensureConfidanteSlotForAuto(){
  if(!S||!S.autoPlay)return;
  if(!S.confidantes)S.confidantes=[];
  if(S.partner&&!S.partnerDead&&S.partner.stage==='夫妻'&&S.autoPartnerMeet===false)return;
  if(S.confidantes.length<10)return;
  var worst=0,wr=99;
  for(var i=0;i<S.confidantes.length;i++){
    var r=tierRank(S.confidantes[i].aptitude||'凡品');
    if(r<wr){wr=r;worst=i;}
  }
  var drop=S.confidantes.splice(worst,1)[0];
  if(drop&&S.log)S.log.push('【自動】紅顏已滿，割捨資質最低的 '+drop.name+'（'+(drop.aptitude||'?')+'）');
}
function choose(i){
  var ev=S.currentEvent;var opt=(ev.options||ev.opts)[i];var result;
  var before={martial:S.martial,inner:S.inner,wisdom:S.wisdom,fortune:S.fortune,calm:S.calm,maxHp:S.maxHp,money:S.money,fame:S.fame,hp:S.hp,righteous:S.righteous,demonic:S.demonic,stress:S.stress};
  S._pendingBattle=null;
  try{
    if(opt.stat){
      var sks=opt.stat==='power'?['martial','inner']:[opt.stat];
      var bn=0;
      for(var k in S.equip){var e=S.equip[k];if(!e)continue;if(sks.indexOf(e.main.key)>=0)bn+=e.main.val;e.subs.forEach(function(s){if(sks.indexOf(s.key)>=0)bn+=s.val;});}
      S.skills.forEach(function(sk){if(sks.indexOf(sk.main.key)>=0)bn+=sk.main.val;sk.subs.forEach(function(s){if(sks.indexOf(s.key)>=0)bn+=s.val;});});
      if(S.partner&&!S.partnerDead&&sks.indexOf(S.partner.traitKey)>=0)bn+=S.partner.traitVal;
      var sv=opt.stat==='fortune'?S.fortune+bn:opt.stat==='wisdom'?S.wisdom+bn:S.martial+S.inner/2+bn;
      var roll=sv+rnd(30);
      if(hasTalent('氣運之子'))roll+=15;
      var ok=roll>=opt.diff;
      result=ok?opt.win():opt.lose();
    }else result=opt.f?opt.f(S):'你做出了選擇。';
  }catch(err){result='（事件因故中斷）';S.log.push('事件執行錯誤：'+(err.message||err));}
  if(S._pendingBattle){
    var pb=S._pendingBattle;S._pendingBattle=null;S.pendingResult=null;
    clampMoney();checkAchievements();saveGame();
    startBattle(pb.name,null,null,null,pb.source||'event');
    return;
  }
  var deltas=[];
  function dl(label,cur,bef){var d=cur-bef;if(d===0)return;deltas.push(label+(d>0?' +':' ')+d);}
  dl('武力',S.martial,before.martial);dl('內力',S.inner,before.inner);dl('悟性',S.wisdom,before.wisdom);
  dl('福緣',S.fortune,before.fortune);dl('靜',S.calm,before.calm);dl('血量上限',S.maxHp,before.maxHp);
  dl('銀兩',S.money,before.money);dl('名聲',S.fame,before.fame);dl('俠氣',S.righteous,before.righteous);
  dl('魔性',S.demonic,before.demonic);dl('壓力',S.stress,before.stress);
  if(deltas.length>0)result+=' <span style="color:#fbbf24;font-weight:bold">【'+deltas.join('　')+'】</span>';
  clampMoney();try{applyAutoCompanionFilters();}catch(e){}
  S.pendingResult=result;checkAchievements();render();renderEvent();saveGame();
  if(S.autoPlay)scheduleAutoPlay();
}
function afterChoice(){
  clampMoney();
  S.pendingResult=null;
  var wasSpecial=S._isSpecialEvent;S._isSpecialEvent=false;
  checkBountyCompletion();
  if(checkAbandonedChildRevenge()){if(S.autoPlay)scheduleAutoPlay();return;}
  if(wasSpecial){
    S._specialStreak=(S._specialStreak||0)+1;
    if(S._specialStreak>=3){S._specialStreak=0;nextMonth(true);}
    else nextMonth();
    if(S.autoPlay)scheduleAutoPlay();
    return;
  }
  S._specialStreak=0;
  // 自動歷練：連續戰鬥達上限則不再隨機開打，避免死迴圈
  var canRandFight=S.age>=14&&chance(.15);
  if(S.autoPlay&&(S._autoBattleStreak||0)>=2)canRandFight=false;
  if(canRandFight){
    S._autoBattleStreak=(S._autoBattleStreak||0)+1;
    startBattle(pick(['山賊','惡霸','江洋大盜','魔教爪牙','武林敗類','野狼','黑熊']),null,null,null,'normal');
    if(S.autoPlay)scheduleAutoPlay();
    return;
  }
  S._autoBattleStreak=0;
  nextMonth();
  if(S.autoPlay)scheduleAutoPlay();
}

function inheritStats(){
  if(!S||!S.gameOver)return;
  if(S._statsInherited){toast('已經繼承過了');return;}
  if(TOTAL_SCORE<=0){toast('沒有積分可消耗');return;}
  var cost=Math.floor(TOTAL_SCORE/2);
  if(cost<1){toast('積分不足');return;}
  var r=0.5;
  var bonus={
    martial:Math.floor((S.martial||0)*r),
    inner:Math.floor((S.inner||0)*r),
    wisdom:Math.floor((S.wisdom||0)*r),
    fortune:Math.floor((S.fortune||0)*r),
    calm:Math.floor((S.calm||0)*r),
    maxHp:Math.floor((S.maxHp||0)*r),
    money:Math.floor((S.money||0)*r),
    fame:Math.floor((S.fame||0)*r)
  };
  // 與既有繼承累加（除非徹底重置，否則保留）
  var prev={};
  try{var raw=localStorage.getItem('wuxiaInheritanceBonus');if(raw)prev=JSON.parse(raw)||{};}catch(e){}
  var merged={
    martial:(prev.martial||0)+bonus.martial,
    inner:(prev.inner||0)+bonus.inner,
    wisdom:(prev.wisdom||0)+bonus.wisdom,
    fortune:(prev.fortune||0)+bonus.fortune,
    calm:(prev.calm||0)+bonus.calm,
    maxHp:(prev.maxHp||0)+bonus.maxHp,
    money:(prev.money||0)+bonus.money,
    fame:(prev.fame||0)+bonus.fame
  };
  confirmBox('💎 屬性繼承','消耗一半積分（'+cost+'／現有 '+TOTAL_SCORE+'），將本世 50% 屬性累加至來世基礎？\n\n武力 +'+bonus.martial+'\n內力 +'+bonus.inner+'\n悟性 +'+bonus.wisdom+'\n福緣 +'+bonus.fortune+'\n靜 +'+bonus.calm+'\n血量上限 +'+bonus.maxHp+'\n銀兩 +'+bonus.money+'\n名聲 +'+bonus.fame+'\n\n（累積繼承直至徹底重置才清除）',function(){
    S._statsInherited=true;
    TOTAL_SCORE-=cost;if(TOTAL_SCORE<0)TOTAL_SCORE=0;saveScore();
    try{localStorage.setItem('wuxiaInheritanceBonus',JSON.stringify(merged));}catch(e){}
    toast('已繼承 50% 屬性，消耗 '+cost+' 積分');
    renderEnding(document.getElementById('event'));
  });
}

function applyInheritanceBonus(){
  var raw;try{raw=localStorage.getItem('wuxiaInheritanceBonus');}catch(e){return false;}
  if(!raw)return false;
  var b;try{b=JSON.parse(raw);}catch(e){return false;}
  if(!b)return false;
  S.martial+=b.martial||0;S.inner+=b.inner||0;S.wisdom+=b.wisdom||0;S.fortune+=b.fortune||0;S.calm+=b.calm||0;
  S.maxHp+=b.maxHp||0;S.hp+=b.maxHp||0;S.money+=b.money||0;S.fame+=b.fame||0;
  S.log.push('【轉世】繼承前世 25% 屬性。');
  try{localStorage.removeItem('wuxiaInheritanceBonus');}catch(e){}
  return true;
}

function calcFinalScore(ending){
  var es={'英年早逝':0,'戰死沙場':100,'江湖過客':500,'陰陽兩隔':800,'生死相依':2000,'紅顏相伴':2500,'記名弟子':600,'親傳弟子':2000,'正道傳人':12000,'邪道巨擘':12000,'亡命之徒':1500,'江湖棄徒':1000,'寵物大師':1500,'萬獸之王':4000,'神獸之主':15000,'武林神話':35000,'武林盟主':25000,'魔教教主':25000,'邪道梟雄':18000,'神仙眷侶':12000,'紅顏環繞':20000,'孤獨終老':300,'隱世高人':2500,'一方富商':1200,'福星高照':3000,'猜謎宗師':6000,'謎道至尊':12000,'成就宗師':28000};
  var score=100;
  if(es[ending.t]!==undefined)score+=es[ending.t];else score+=1000;
  score+=(S.martial+S.inner+S.wisdom+S.fortune+S.calm)*4;
  score+=S.fame*10;score+=Math.max(S.righteous,S.demonic)*3;score+=S.age*15;
  if(S.partner&&!S.partnerDead)score+=500;
  if(S.partner&&S.partner.stage==='夫妻')score+=1500;
  if(S.confidantes&&S.confidantes.length){score+=S.confidantes.length*800;S.confidantes.forEach(function(c){score+=Math.floor((c.love||0)*10);});}
  score+=S.children*300;
  if(S.childrenList)S.childrenList.forEach(function(c){score+=400+Math.floor((c.martial+c.inner+c.wisdom+c.fortune)/2);});
  S.pets.forEach(function(p){score+=300+p.stage*500+(p.destinyTalent?1000:0);});
  S.skills.forEach(function(sk){score+=Math.floor(150*TIERS[sk.tier].mult);});
  S.bagEquip.forEach(function(e){score+=Math.floor(40*TIERS[e.tier].mult);});
  for(var k in S.equip){var e=S.equip[k];if(e)score+=Math.floor(40*TIERS[e.tier].mult);}
  for(var ws in S.equip){var we=S.equip[ws];if(we&&we.isMasterWeapon)score+=we.level*500;}
  if(S.hasAuctionTicket)score+=5000;
  score+=S.riddleHistory.length*100;score+=(S.riddleCorrect||0)*80;
  if(S.master)score+=(S.master.rank+1)*1000;
  if(S.exileCount>0)score-=S.exileCount*1000;
  ACHIEVEMENTS.forEach(function(a){if(hasAchievement(a.id))score+=3000;});
  if(score<1)score=1;if(score>99999)score=99999;
  return Math.floor(score);
}

    var key=WIKI_CAT+'_'+i;

  document.getElementById('tabMain').classList.add('on');
  createChar();
}
function createChar(){
  var el=document.getElementById('event');
  document.getElementById('status').innerHTML='';
  var logEl=document.getElementById('log');if(logEl)logEl.innerHTML='';
  if(typeof renderSidePanel==='function')renderSidePanel();
  el.innerHTML=
    '<div class="ev-meta" style="text-align:center">開局流程</div>'+
    '<h2 style="text-align:center;border:none">鑄就此身</h2>'+
    '<p style="text-align:center;color:var(--muted);font-size:13px">選性別、定天賦、起姓名——完成後方踏入江湖。</p>'+
    '<div class="steps"><span class="step on">① 性別</span><span class="step">② 天賦</span><span class="step">③ 姓名</span><span class="step">④ 入世</span></div>'+
    '<p style="color:var(--muted);font-size:12px">此身男兒骨，或是紅顏俠。性別影響門派稱謂與部分奇遇，踏入江湖後不可再改。</p>'+
    '<div class="gender-pick">'+
    '<div class="gender-card" id="gMale" onclick="pickGenderUI(\'男\')"><div class="gicon">♂</div><div class="gt">俠客・少俠</div><div style="font-size:11px;color:var(--muted);margin-top:4px">兄臺／師兄路線</div></div>'+
    '<div class="gender-card" id="gFemale" onclick="pickGenderUI(\'女\')"><div class="gicon">♀</div><div class="gt">俠女・女俠</div><div style="font-size:11px;color:var(--muted);margin-top:4px">姑娘／師妹路線</div></div>'+
    '</div>'+
    '<button class="main" onclick="confirmChar(window._pickGender||\'男\')">確認性別・下一步</button>'+
    '<div style="margin-top:18px;padding-top:12px;border-top:1px solid var(--line)"><div style="color:var(--muted);font-size:12px;margin-bottom:6px">已有存檔？</div><button type="button" class="ghost" onclick="importSave()">從檔案匯入存檔</button></div>';
}
function pickGenderUI(g){
  window._pickGender=g;
  var m=document.getElementById('gMale'),f=document.getElementById('gFemale');
  if(m)m.classList.toggle('sel',g==='男');
  if(f)f.classList.toggle('sel',g==='女');
}

function confirmChar(g){
  S.playerGender=g||window._pickGender||'男';
  // 姓名步驟
  var el=document.getElementById('event');
  el.innerHTML=
    '<div class="ev-meta" style="text-align:center">開局流程</div>'+
    '<h2 style="text-align:center;border:none">江湖如何喚你</h2>'+
    '<div class="steps"><span class="step done">① 性別</span><span class="step on">② 姓名</span><span class="step">③ 天賦</span><span class="step">④ 入世</span></div>'+
    '<p style="color:var(--muted);font-size:13px">姓名將貫穿奇遇對白、戰報與年譜。限 1～8 字。</p>'+
    '<div style="text-align:center;margin:8px 0"><span style="display:inline-block;padding:4px 12px;border:1px solid var(--line-dk);border-radius:16px;font-size:12px;color:var(--gold)">'+(S.playerGender==='男'?'♂ 俠客・少俠':'♀ 俠女・女俠')+'</span></div>'+
    '<input type="text" id="charName" placeholder="例如：沈孤舟" maxlength="8">'+
    '<button type="button" class="ghost" onclick="randomCharName()">隨機起名</button>'+
    '<button class="main" onclick="finishNameAndTalent()">確認姓名・選擇天賦</button>';
}
function randomCharName(){
  var a=['沈孤舟','陸無痕','楚天行','蘇晚晴','葉青衣','唐青衣','顧長歌','蕭夜白'];
  var el=document.getElementById('charName');
  if(el)el.value=a[Math.floor(Math.random()*a.length)];
}
function finishNameAndTalent(){
  var input=document.getElementById('charName');
  var n=input?input.value.trim():'';
  if(!n)n=S.playerGender==='男'?'無名俠客':'無名女俠';
  S.playerName=n;
  S.log.push('【'+S.playerGender+'】'+n+' 踏上江湖路。');
  drawTalent();
}

var TALENTS={
'凡品':[{name:'體健',d:'血量上限+20',f:function(s){s.maxHp+=20;s.hp+=20;}},{name:'好學',d:'悟性+3',f:function(s){s.wisdom+=3;}},{name:'小富',d:'銀兩+30',f:function(s){s.money+=30;}},{name:'沉穩',d:'靜+5',f:function(s){s.calm+=5;}},{name:'勇敢',d:'武力+3',f:function(s){s.martial+=3;}}],
'良品':[{name:'天生神力',d:'武力+8',f:function(s){s.martial+=8;}},{name:'過目不忘',d:'悟性+8',f:function(s){s.wisdom+=8;}},{name:'錦衣玉食',d:'銀兩+80',f:function(s){s.money+=80;}},{name:'心如止水',d:'靜+10',f:function(s){s.calm+=10;}},{name:'福星高照',d:'福緣+8',f:function(s){s.fortune+=8;}}],
'上品':[{name:'武學奇才',d:'武力+15，內力+10',f:function(s){s.martial+=15;s.inner+=10;}},{name:'慧根深種',d:'悟性+15',f:function(s){s.wisdom+=15;}},{name:'富甲一方',d:'銀兩+200',f:function(s){s.money+=200;}},{name:'遇險呈祥',d:'福緣+15',f:function(s){s.fortune+=15;}},{name:'鐵骨錚錚',d:'血量上限+80',f:function(s){s.maxHp+=80;s.hp+=80;}}],
'絕品':[{name:'天生武骨',d:'武力+25，內力+20',f:function(s){s.martial+=25;s.inner+=20;}},{name:'玲瓏心思',d:'悟性+25，福緣+10',f:function(s){s.wisdom+=25;s.fortune+=10;}},{name:'富可敵國',d:'銀兩+500',f:function(s){s.money+=500;}},{name:'天命所歸',d:'福緣+25，靜+15',f:function(s){s.fortune+=25;s.calm+=15;}},{name:'金剛不壞',d:'血量上限+200',f:function(s){s.maxHp+=200;s.hp+=200;}}],
'神品':[
{name:'武神轉世',d:'武力+40，內力+40，血量上限+150',ability:'戰意沸騰：戰鬥中每回合有 30% 機率觸發「武神附體」，該回合攻擊傷害翻倍。',f:function(s){s.martial+=40;s.inner+=40;s.maxHp+=150;s.hp+=150;}},
{name:'智慧通天',d:'悟性+40，福緣+20',ability:'洞察天機：猜謎時選項從 4 個縮減為 2 個。',f:function(s){s.wisdom+=40;s.fortune+=20;}},
{name:'財神眷顧',d:'銀兩+1500',ability:'點石成金：所有銀兩收入 +50%，拍賣對手加價率降至 15%。',f:function(s){s.money+=1500;}},
{name:'氣運之子',d:'福緣+40，靜+20',ability:'天命所歸：事件判定 +15，戰鬥中 6% 完全閃避。',f:function(s){s.fortune+=40;s.calm+=20;}},
{name:'不死之身',d:'血量上限+500，每月回血+5',ability:'浴火重生：致命傷害鎖血 1 點，5 回合不死（每場一次）。',f:function(s){s.maxHp+=500;s.hp+=500;s.regen=5;}}
]};

function showTowerTalentPick(){
  if(IS_FIRST_LIFE){toast('初次人生尚無塔天賦');return;}
  var list=typeof getTowerUnlockedList==='function'?getTowerUnlockedList():[];
  if(!list.length){toast('尚未解鎖任何時空之塔天賦');return;}
  window._towerTalentPicks=list;
  var el=document.getElementById('event');
  var html='<div class="ev-meta" style="text-align:center">時空之塔</div><h2 style="text-align:center;border:none">選擇塔天賦</h2>';
  html+='<p style="text-align:center;color:var(--muted);font-size:13px">以下為已解鎖的塔天賦，選一項作為本世加成（可略過）</p>';
  list.forEach(function(u,i){
    html+='<div class="talent-box" style="border-color:#60a5fa" onclick="chooseTowerTalent('+i+')">';
    html+='<span class="tt" style="color:#60a5fa">🕰 塔・'+u.role+'</span>';
    html+='<div class="tn" style="color:#60a5fa">'+(u.icon||'')+' '+u.name+'</div>';
    html+='<div class="td">'+u.desc+'</div>';
    html+='<div style="font-size:11px;color:var(--muted);margin-top:4px">解鎖層：'+(u.floor||'?')+'</div></div>';
  });
  html+='<button type="button" class="ghost" onclick="drawTalent()">← 返回普通天賦</button>';
  el.innerHTML=html;
}
function chooseTowerTalent(i){
  var list=window._towerTalentPicks||[];
  var u=list[i];
  if(!u){toast('資料遺失');return;}
  // 塔天賦暫存，仍需選普通天賦；或直接套用並進入
  window._pendingTowerTalent=u;
  toast('已選定塔天賦：'+u.name+'，請再選一項普通天賦');
  drawTalent();
}
function applyPendingTowerTalent(){
  var u=window._pendingTowerTalent;
  if(!u||!S)return;
  S.towerTalentId=u.id;S.towerTalentName=u.name;
  S.martial=(S.martial||0)+5;S.inner=(S.inner||0)+5;S.maxHp=(S.maxHp||0)+50;S.hp=(S.hp||0)+50;
  if(S.log)S.log.push('【時空之塔】繼承天賦：'+u.name);
  window._pendingTowerTalent=null;
}
function drawTalent(){
  var picks=[];
  if(IS_FIRST_LIFE){for(var i=0;i<3;i++)picks.push({tier:'神品',talent:pick(TALENTS['神品']),source:'normal'});}
  else{for(var i=0;i<3;i++){var tier=rollTier();picks.push({tier:tier,talent:pick(TALENTS[tier]),source:'normal'});}}
  // 時空之塔已解鎖天賦（來生可選）
  var towerList=typeof getTowerUnlockedList==='function'?getTowerUnlockedList():[];
  towerList.forEach(function(u){
    picks.push({
      tier:'塔·'+u.role,
      source:'tower',
      towerId:u.id,
      talent:{
        name:u.icon+' '+u.name,
        d:'【時空之塔】'+u.desc,
        ability:'塔天賦・通過塔層解鎖',
        f:function(s){s.towerTalentId=u.id;s.towerTalentName=u.name;s.martial=(s.martial||0)+5;s.inner=(s.inner||0)+5;s.maxHp=(s.maxHp||0)+50;}
      }
    });
  });
  var el=document.getElementById('event');
  var html='<div class="ev-meta" style="text-align:center">開局流程</div><h2 style="text-align:center;border:none">'+S.playerName+'，選擇你的天賦</h2><div class="steps"><span class="step done">① 性別</span><span class="step done">② 姓名</span><span class="step on">③ 天賦</span><span class="step">④ 入世</span></div>';
  if(IS_FIRST_LIFE)html+='<div style="text-align:center;color:#92400e;font-size:13px;margin:8px 0;padding:10px;background:#fef3c7;border:1px solid #f0d48a;border-radius:8px">✦ 初次踏入江湖，天賦必為神品 ✦</div>';
  else html+='<div style="text-align:center;color:#92400e;font-size:13px;margin:8px 0;padding:10px;background:#fef3c7;border:1px solid #f0d48a;border-radius:8px">當前積分：<b>'+TOTAL_SCORE+'</b>　刷新消耗 <b>10</b> 分</div>';
  if(towerList.length)html+='<button type="button" class="main" style="background:linear-gradient(180deg,#1e3a5f,#0f2744);border-color:#60a5fa;color:#93c5fd;margin:8px 0" onclick="showTowerTalentPick()">🕰 時空之塔天賦（已解鎖 '+towerList.length+' 個）</button>';
  for(var k=0;k<picks.length;k++){
    var pk=picks[k];
    var c=pk.source==='tower'?'#60a5fa':(TIERS[pk.tier]?TIERS[pk.tier].c:'#c9b58a');
    var talent=pk.talent;
    html+='<div class="talent-box" style="border-color:'+c+'" onclick="chooseTalent('+k+')"><span class="tt" style="color:'+c+'">'+(pk.source==='tower'?'🕰時空之塔':pk.tier)+'</span><div class="tn" style="color:'+c+'">'+talent.name+'</div><div class="td">'+talent.d+'</div>';
    if(talent.ability)html+='<div style="font-size:11px;color:#fbbf24;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.5">✦ 專屬能力：'+talent.ability+'</div>';
    html+='</div>';
  }
  html+='<button class="main" onclick="refreshTalent()">🔄 刷新天賦（-10 分）</button>';
  el.innerHTML=html;window._picks=picks;
}
function refreshTalent(){
  if(TOTAL_SCORE<10){toast('積分不足');return;}
  TOTAL_SCORE-=10;saveScore();
  if(chance(0.02)){showMythicStart();return;}
  drawTalent();
}
function showMythicStart(){
  var el=document.getElementById('event');
  var h='<h2 style="color:#fbbf24;font-size:22px;text-align:center;letter-spacing:4px;border:none">✦ 天命所歸 ✦</h2>';
  h+='<p style="text-align:center;color:var(--gold);font-size:14px;margin:8px 0">萬中無一的機緣降臨了……</p>';
  MASTERS.forEach(function(m){
    var sc=m.side==='正道'?'#4ade80':'#ef4444';
    h+='<div class="masterCard" style="border-color:'+sc+';cursor:pointer" onclick="applyMythicStart(\''+m.name+'\')">';
    h+='<div class="mn" style="color:'+sc+'">'+m.name+'</div>';
    h+='<div class="ms">'+(m.side==='正道'?'【正道宗師】':'【邪道巨擘】')+'　品階：<span style="color:'+TIERS[m.tier].c+'">'+m.tier+'</span></div>';
    h+='<div class="mdesc">「'+m.desc+'」</div></div>';
  });
  h+='<button class="main" onclick="drawTalent()">放棄機緣</button>';
  el.innerHTML=h;
}
function applyMythicStart(masterName){
  var m=findMaster(masterName);if(!m)return;
  var talent=pick(TALENTS['神品']);
  S.talent={tier:'神品',talent:talent};talent.f(S);
  if(m.side==='正道'){S.righteous+=30;S.demonic=0;}else{S.demonic+=30;S.righteous=0;}
  S.master={name:m.name,side:m.side,rank:0,tier:m.tier,metMonth:0,skills:[],weapon:null};
  grantMasterRank();
  var w=genEquip('主手');w.tier='凡品';w.name='鐵劍';w.main={name:'武力',key:'martial',val:3};
  S.equip['主手']=w;
  S.log.push('【天命】你自幼被'+m.name+'收為記名弟子！');
  applyInheritanceBonus();
  markPlayed();IS_FIRST_LIFE=false;
  TAB='main';render();nextMonth();
}
function chooseTalent(i){
  try{
    if(!window._picks||!window._picks[i]){toast('天賦資料遺失，重新抽取');drawTalent();return;}
    var p=window._picks[i];
    if(!S.equip)S.equip=emptyEquipSlots();
    S.talent=p;
    if(p.talent&&typeof p.talent.f==='function')p.talent.f(S);
    try{applyPendingTowerTalent();}catch(e){}
    window._picks=null;
    var w=genEquip('主手');w.tier='凡品';w.name='鐵劍';w.main={name:'武力',key:'martial',val:3};
    S.equip['主手']=w;
    S.log.push('【'+p.tier+'】'+p.talent.name+'：'+p.talent.d);
    if(p.talent.ability)S.log.push('【專屬能力】'+p.talent.ability);
    try{applyInheritanceBonus();}catch(e1){}
    if(IS_FIRST_LIFE){showFirstLifeMasterSelect();return;}
    render();nextMonth();
  }catch(err){
    console.error('chooseTalent',err);
    toast('選擇天賦時出錯，已重試');
    try{drawTalent();}catch(e2){}
  }
}
function pickStartMasters(){
  var zheng=MASTERS.filter(function(m){return m.side==='正道';});
  var xie=MASTERS.filter(function(m){return m.side==='邪道';});
  var a=zheng.length?zheng[Math.floor(Math.random()*zheng.length)]:null;
  var b=xie.length?xie[Math.floor(Math.random()*xie.length)]:null;
  window._startMasters=[a,b].filter(Boolean);
  return window._startMasters;
}
function showFirstLifeMasterSelect(){
  var el=document.getElementById('event');
  var list=pickStartMasters();
  var h='<h2 style="color:#fbbf24;font-size:22px;text-align:center;letter-spacing:4px;border:none">✦ 天命所歸 ✦</h2>';
  h+='<p style="text-align:center;color:var(--muted);font-size:13px;margin:10px 0 14px">本世可選師父（一正一邪，每次開局重新隨機）</p>';
  list.forEach(function(m){
    if(!m)return;
    var sc=m.side==='正道'?'#16a34a':'#b91c1c';
    h+='<div class="masterCard" style="border-color:'+sc+';cursor:pointer" onclick="applyFirstLifeMaster(\''+m.name+'\')">';
    h+='<div class="mn" style="color:'+sc+'">'+m.name+'</div>';
    h+='<div class="ms">'+(m.side==='正道'?'【正道宗師】':'【邪道巨擘】')+(m.era?' · '+m.era:'')+'　<span style="color:'+TIERS[m.tier].c+'">'+m.tier+'</span></div>';
    h+='<div class="mdesc">「'+m.desc+'」</div>';
    h+='<div style="font-size:11px;color:var(--muted);margin-top:6px">專屬：'+(m.weapon?m.weapon.name:'無')+'</div></div>';
  });
  h+='<button class="main" onclick="skipFirstLifeMaster()">不入師門，獨自闖蕩</button>';
  el.innerHTML=h;
}
function applyFirstLifeMaster(masterName){
  try{
    if(!S){toast('狀態遺失，請重新開始');try{newGame();}catch(e){location.reload();}return;}
    if(!S.log)S.log=[];
    if(!S.skills)S.skills=[];
    if(!S.equip)S.equip=emptyEquipSlots();
    if(S.righteous===undefined)S.righteous=0;
    if(S.demonic===undefined)S.demonic=0;
    var m=findMaster(masterName);
    if(!m){toast('找不到師父：'+masterName);return;}
    if(m.side==='正道'){S.righteous=(S.righteous||0)+30;S.demonic=0;}
    else{S.demonic=(S.demonic||0)+30;S.righteous=0;}
    S.master={name:m.name,side:m.side,rank:0,tier:m.tier||'神品',metMonth:0,skills:[],weapon:null};
    try{grantMasterRank();}catch(e1){console.error('grantMasterRank',e1);S.log.push('【師門】入門傳授時出現波折，稍後可再向師父請益。');}
    S.log.push('【天命】你自幼被'+m.name+'收為記名弟子！');
    try{applyInheritanceBonus();}catch(e2){}
    try{markPlayed();}catch(e3){}
    IS_FIRST_LIFE=false;
    TAB='main';
    try{document.getElementById('tabsBar').style.display='flex';}catch(e4){}
    try{render();}catch(e5){console.error('render',e5);}
    try{nextMonth();}catch(e6){
      console.error('nextMonth',e6);
      try{S.currentEvent={id:'_boot',t:'你拜入師門，開始了江湖生涯。',options:[{t:'踏上旅程',f:function(){return '江湖路遠，且去闖蕩。';}}]};renderEvent();}catch(e7){}
    }
    try{saveGame();}catch(e8){}
    toast('拜入 '+m.name+' 門下');
  }catch(err){
    console.error('applyFirstLifeMaster',err);
    toast('拜師出錯，已嘗試恢復');
    try{IS_FIRST_LIFE=false;TAB='main';render();nextMonth();}catch(e9){location.reload();}
  }
}
function skipFirstLifeMaster(){
  try{
    if(!S){newGame();return;}
    if(!S.log)S.log=[];
    S.log.push('你選擇不入師門，独自闯荡江湖。');
    markPlayed();IS_FIRST_LIFE=false;TAB='main';
    try{document.getElementById('tabsBar').style.display='flex';}catch(e){}
    try{render();}catch(e){}
    try{nextMonth();}catch(e){}
    saveGame();
  }catch(err){console.error(err);IS_FIRST_LIFE=false;try{nextMonth();}catch(e){}}
}
function getAlignmentValue(){return S.righteous-S.demonic;}
function getAlignment(){var v=getAlignmentValue();if(v>=20)return{name:'正道',color:'#4ade80',val:v};if(v<=-20)return{name:'邪道',color:'#ef4444',val:v};return{name:'中立',color:'#9ca3af',val:v};}

/* ========== 啟動 ========== */
try{boot();}catch(err){
  var errEl=document.getElementById('event');
  if(errEl)errEl.innerHTML='<h2 style="color:#ef4444">⚠ 啟動錯誤</h2><p style="color:var(--gold)">'+(err&&err.message?err.message:'未知錯誤')+'</p><pre style="color:var(--muted);font-size:10px;overflow:auto;white-space:pre-wrap">'+(err&&err.stack?err.stack:'')+'</pre>';
  if(console&&console.error)console.error('啟動錯誤:',err);
}
</script>
</body>
</html>
