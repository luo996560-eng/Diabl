name: Build and deploy game to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify pack manifest hashes
        run: node tools/update-manifest.mjs --check

      - name: Test data-pack loader and Niukou modules
        run: node --test tests/

      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R core packs _site/

          # Copy common static-asset folders when they exist.
          for directory in assets images img css js fonts audio media; do
            if [[ -d "$directory" ]]; then
              cp -R "$directory" "_site/$directory"
            fi
          done

          if [[ -f 404.html ]]; then
            cp 404.html _site/
          fi

          # Prevent GitHub Pages from running an implicit Jekyll build.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
